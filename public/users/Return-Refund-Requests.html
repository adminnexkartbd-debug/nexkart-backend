<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return & Refund Requests</title>
    
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://cdn.tailwindcss.com https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://fonts.googleapis.com https://cdn.jsdelivr.net https://unpkg.com;
        font-src 'self' https://cdnjs.cloudflare.com https://fonts.gstatic.com;
        img-src 'self' data: https:;
        connect-src 'self';
    ">

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="https://unpkg.com/aos@next/dist/aos.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <style>
        :root {
            --bg-color: #fdf6f8;
            --primary-pink: #e85a8a;
            --dark-pink: #9e2a52;
            --light-pink-bg: #fff0f5;
            --border-pink: #f8c8dc;
            --text-dark: #33272b;
            --text-muted: #8c7a82;
            --white: #ffffff;
            --card-shadow: 0 10px 30px rgba(232, 90, 138, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-dark); padding: 40px 15px; }
        .container { max-width: 850px; margin: 0 auto; }
        .top-bar { display: flex; align-items: center; gap: 15px; margin-bottom: 30px; }
        .btn-back {
            display: inline-flex; align-items: center; justify-content: center;
            width: 42px; height: 42px; background-color: var(--white);
            color: var(--dark-pink); border: 1px solid var(--border-pink);
            border-radius: 12px; text-decoration: none; font-size: 16px;
            transition: all 0.3s ease;
        }
        .btn-back:hover { background-color: var(--primary-pink); color: var(--white); }
        .page-title { font-size: 22px; font-weight: 700; color: var(--dark-pink); display: flex; align-items: center; gap: 10px; }

        .returns-list { display: flex; flex-direction: column; gap: 20px; }
        .return-card {
            background: var(--white); border-radius: 18px; box-shadow: var(--card-shadow);
            border: 1px solid var(--border-pink); padding: 22px; transition: all 0.3s ease;
            position: relative;
        }
        .card-header {
            display: flex; justify-content: space-between; align-items: center;
            padding-bottom: 14px; border-bottom: 1px dashed var(--border-pink); margin-bottom: 16px;
        }
        .order-meta span { font-size: 13px; color: var(--text-muted); margin-right: 12px; }
        .order-meta strong { color: var(--dark-pink); }

        .header-actions { display: flex; align-items: center; gap: 12px; }

        .status-badge {
            padding: 6px 14px; border-radius: 30px; font-size: 11px; font-weight: 600;
            display: inline-flex; align-items: center; gap: 6px; text-transform: capitalize;
        }
        .status-pending { background-color: #fff8e6; color: #b7791f; }
        .status-approved { background-color: #e6f4ea; color: #1e7e34; }
        .status-rejected { background-color: #fde8e8; color: #c81e1e; }

        /* 3-Dot Dropdown Styling */
        .dropdown { position: relative; display: inline-block; }
        .dots-btn {
            background: none; border: none; color: var(--text-muted);
            font-size: 16px; cursor: pointer; padding: 6px 10px; border-radius: 8px;
            transition: all 0.2s ease;
        }
        .dots-btn:hover { background-color: var(--light-pink-bg); color: var(--dark-pink); }
        .dropdown-menu {
            display: none; position: absolute; right: 0; top: 100%;
            background-color: var(--white); min-width: 140px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            border-radius: 10px; border: 1px solid var(--border-pink); z-index: 10; overflow: hidden;
        }
        .dropdown-menu.show { display: block; }
        .dropdown-item {
            display: flex; align-items: center; gap: 8px; width: 100%; padding: 10px 14px;
            font-size: 13px; color: #dc3545; background: none; border: none;
            text-align: left; cursor: pointer; font-weight: 500; transition: background 0.2s;
        }
        .dropdown-item:hover { background-color: #fff0f3; }

        .card-body { display: grid; grid-template-columns: 1.8fr 1.2fr; gap: 20px; margin-bottom: 16px; }
        @media (max-width: 650px) { .card-body { grid-template-columns: 1fr; } }

        .info-label { font-size: 11px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 3px; font-weight: 600; }
        .info-value { font-size: 14px; font-weight: 600; color: var(--text-dark); }
        .item-id { font-size: 12px; color: var(--primary-pink); font-weight: 500; }

        .reason-box {
            background-color: var(--light-pink-bg); padding: 12px; border-radius: 12px;
            margin-top: 10px; font-size: 13px; border-left: 4px solid var(--primary-pink);
        }
        .reason-box em { color: #666; display: block; margin-top: 2px; font-style: normal; font-size: 12px; }

        .card-footer {
            display: flex; justify-content: flex-end; align-items: center;
            padding-top: 14px; border-top: 1px solid var(--light-pink-bg);
        }
        .request-date { color: var(--text-muted); font-size: 12px; }
        .no-data { text-align: center; padding: 40px; background: #fff; border-radius: 18px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <div class="top-bar">
        <a href="javascript:history.back()" class="btn-back" title="Go Back">
            <i class="fa-solid fa-arrow-left"></i>
        </a>
        <h2 class="page-title">
            <i class="fa-solid fa-rotate-left"></i> Return & Refund Requests
        </h2>
    </div>

    <div class="returns-list" id="returnsContainer">
        <div class="no-data">Loading Data...</div>
    </div>
</div>

<script src="https://unpkg.com/aos@next/dist/aos.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<script>
    if (typeof AOS !== 'undefined') {
        AOS.init({ duration: 800, once: true });
    }

    // Dropdown অন্য কোথাও ক্লিক করলে বন্ধ করার ব্যবস্থা
    window.addEventListener('click', function(e) {
        if (!e.target.matches('.dots-btn') && !e.target.matches('.dots-btn *')) {
            document.querySelectorAll('.dropdown-menu').forEach(menu => menu.classList.remove('show'));
        }
    });

    function toggleDropdown(event, returnId) {
        event.stopPropagation();
        document.querySelectorAll('.dropdown-menu').forEach(menu => {
            if (menu.id !== `dropdown-${returnId}`) {
                menu.classList.remove('show');
            }
        });
        const currentMenu = document.getElementById(`dropdown-${returnId}`);
        currentMenu.classList.toggle('show');
    }

    async function fetchReturnsData() {
        try {
            const response = await fetch('/user/returns/api/data');
            
            if (!response.ok) {
                throw new Error(`HTTP Error! Status: ${response.status}`);
            }

            const data = await response.json();
            const container = document.getElementById('returnsContainer');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = `
                    <div class="no-data">
                        <i class="fa-solid fa-box-open fa-2x"></i>
                        <p style="margin-top: 10px;">No return requests found.</p>
                    </div>`;
                return;
            }

            data.forEach(item => {
                const dateFormatted = new Date(item.created_at).toLocaleString('en-GB', {
                    day: '2-digit', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit'
                });

                let statusBadge = '';
                if (item.status === 'pending') {
                    statusBadge = `<span class="status-badge status-pending"><i class="fa-solid fa-clock"></i> Pending</span>`;
                } else if (item.status === 'approved') {
                    statusBadge = `<span class="status-badge status-approved"><i class="fa-solid fa-circle-check"></i> Approved</span>`;
                } else {
                    statusBadge = `<span class="status-badge status-rejected"><i class="fa-solid fa-circle-xmark"></i> ${item.status}</span>`;
                }

                const cardHTML = `
                    <div class="return-card" data-aos="fade-up" id="return-card-${item.return_id}">
                        <div class="card-header">
                            <div class="order-meta">
                                <span>Return ID: <strong>#RET-${item.return_id}</strong></span>
                                <span>Order ID: <strong>#ORD-${item.order_id}</strong></span>
                            </div>
                            <div class="header-actions">
                                ${statusBadge}
                                <div class="dropdown">
                                    <button class="dots-btn" onclick="toggleDropdown(event, ${item.return_id})">
                                        <i class="fa-solid fa-ellipsis-vertical"></i>
                                    </button>
                                    <div class="dropdown-menu" id="dropdown-${item.return_id}">
                                        <button class="dropdown-item" onclick="deleteReturnRequest(${item.return_id})">
                                            <i class="fa-solid fa-trash-can"></i> Delete Request
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="card-body">
                            <div class="product-details">
                                <div class="info-label">Product Name & ID</div>
                                <div class="info-value">
                                    ${item.product_name || 'N/A'} 
                                    <span class="item-id">(#PROD-${item.product_code || item.product_table_id})</span>
                                </div>
                                <div class="reason-box">
                                    <strong>Reason:</strong> ${item.return_reason}
                                    ${item.return_details ? `<em>"${item.return_details}"</em>` : ''}
                                </div>
                            </div>

                            <div class="seller-details">
                                <div class="info-label">Seller Name & ID</div>
                                <div class="info-value">
                                    ${item.shop_name || 'N/A'} 
                                    <span class="item-id">(#SEL-${item.seller_table_id})</span>
                                </div>
                            </div>
                        </div>

                        <div class="card-footer">
                            <div class="request-date">
                                <i class="fa-regular fa-calendar-check"></i> ${dateFormatted}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHTML;
            });

        } catch (error) {
            console.error('Error fetching data:', error);
            document.getElementById('returnsContainer').innerHTML = `<div class="no-data">Failed to load data.</div>`;
        }
    }

    async function deleteReturnRequest(returnId) {
        const result = await Swal.fire({
            title: 'Are you sure?',
            text: "You won't be able to revert this action!",
            icon: 'warning',
            showCancelButton: true,
            confirmButtonColor: '#e85a8a',
            cancelButtonColor: '#8c7a82',
            confirmButtonText: 'Yes, delete it!'
        });

        if (result.isConfirmed) {
            try {
                const response = await fetch(`/user/returns/api/delete/${returnId}`, {
                    method: 'DELETE'
                });

                const data = await response.json();

                if (response.ok) {
                    Swal.fire({
                        title: 'Deleted!',
                        text: 'Your return request has been deleted.',
                        icon: 'success',
                        confirmButtonColor: '#e85a8a'
                    });
                    
                    // DOM থেকে কার্ড হাইড বা মুছে ফেলা
                    const card = document.getElementById(`return-card-${returnId}`);
                    if (card) {
                        card.remove();
                    }
                } else {
                    Swal.fire('Error!', data.error || 'Failed to delete request.', 'error');
                }
            } catch (error) {
                console.error('Delete Error:', error);
                Swal.fire('Error!', 'Something went wrong.', 'error');
            }
        }
    }

    fetchReturnsData();
</script>

</body>
</html>
