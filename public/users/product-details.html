<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product Details</title>
  <!-- Tailwind CSS & FontAwesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @keyframes fadeIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .animate-fadeIn {
      animation: fadeIn 0.2s ease-out forwards;
    }
  </style>
</head>
<body class="bg-gray-100 text-gray-800">

  <!-- Main Product Section -->
  <main class="max-w-4xl mx-auto p-4 md:p-8">
    <div class="bg-white rounded-3xl p-6 shadow-md border border-gray-100 flex flex-col md:flex-row gap-6">
      
      <!-- Product Image Placeholder -->
      <div class="w-full md:w-1/2 h-64 bg-pink-50 rounded-2xl flex items-center justify-center text-pink-300 text-5xl">
        <i class="fa-solid fa-gift"></i>
      </div>

      <!-- Product Info & Actions -->
      <div class="w-full md:w-1/2 flex flex-col justify-between space-y-4">
        <div>
          <h1 id="product-title" class="text-2xl font-bold text-gray-900">Sample Product</h1>
          <p class="text-sm text-gray-500 mt-1">High quality product description goes here.</p>
          <div class="mt-4 text-xl font-black text-[#ff4b6e]">$<span id="product-price">25.00</span></div>
        </div>

        <!-- Action Buttons -->
        <div class="flex gap-3">
          <button onclick="handleAddToCart()" class="flex-1 bg-pink-100 text-[#ff4b6e] font-bold py-3 rounded-xl hover:bg-pink-200 transition-all text-sm">
            <i class="fa-solid fa-cart-shopping mr-2"></i>Add to Cart
          </button>
          <button onclick="handleOrderNow()" class="flex-1 bg-gradient-to-r from-[#ff4b6e] to-[#ff758c] text-white font-bold py-3 rounded-xl shadow-md hover:opacity-95 transition-all text-sm">
            <i class="fa-solid fa-bolt mr-2"></i>Order Now
          </button>
        </div>
      </div>

    </div>
  </main>

  <!-- Custom Login Dialog Modal -->
  <div id="login-modal" class="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm hidden flex items-center justify-center p-4 transition-all duration-300">
    <div class="theme-glass-card bg-white/95 rounded-3xl max-w-md w-full p-6 md:p-8 space-y-5 relative shadow-2xl border border-pink-200 animate-fadeIn">
      
      <!-- Close Button -->
      <button onclick="closeLoginModal()" type="button" class="absolute top-4 right-4 w-9 h-9 rounded-full bg-pink-100 hover:bg-pink-200 text-[#ff4b6e] flex items-center justify-center transition-all">
        <i class="fa-solid fa-xmark text-lg"></i>
      </button>

      <!-- Modal Header -->
      <div class="text-center space-y-1">
        <div class="w-12 h-12 bg-pink-100 text-[#ff4b6e] rounded-2xl flex items-center justify-center mx-auto text-xl mb-2">
          <i class="fa-solid fa-user-lock"></i>
        </div>
        <h3 class="text-xl font-extrabold text-gray-900">Sign In to Continue</h3>
        <p class="text-xs text-gray-500">Please log in to complete your purchase or action.</p>
      </div>

      <!-- Google Sign In -->
      <a href="#" onclick="redirectToLogin()" class="w-full flex items-center justify-center gap-3 bg-white hover:bg-gray-50 text-gray-700 font-semibold py-3 px-4 rounded-2xl border border-gray-300 shadow-sm transition-all">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Continue with Google</span>
      </a>

      <!-- Divider -->
      <div class="relative flex items-center justify-center">
        <div class="border-t border-gray-200 w-full"></div>
        <span class="bg-white px-3 text-[10px] font-bold text-gray-400 uppercase absolute">Or</span>
      </div>

      <!-- AJAX Login Form -->
      <form id="popup-login-form" class="space-y-3">
        <div>
          <label for="modal-email" class="block text-[11px] font-bold text-gray-700 mb-1">Email</label>
          <input type="email" id="modal-email" required placeholder="Enter email" class="w-full theme-glass-input p-3 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#ff4b6e] border border-gray-200">
        </div>
        <div>
          <label for="modal-password" class="block text-[11px] font-bold text-gray-700 mb-1">Password</label>
          <input type="password" id="modal-password" required placeholder="Enter password" class="w-full theme-glass-input p-3 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-[#ff4b6e] border border-gray-200">
        </div>
        <button type="submit" id="modal-login-btn" class="w-full bg-gradient-to-r from-[#ff4b6e] to-[#ff758c] text-white font-bold py-3 rounded-xl shadow-md hover:opacity-95 transition-all text-xs">
          Sign In
        </button>
      </form>

    </div>
  </div>

  <!-- JavaScript Logic -->
  <script>
    // ডামি ডেটা (প্রয়োজন অনুযায়ী ডায়নামিক সেট করবেন)
    let isUserLoggedIn = false; // সার্ভার থেকে চেক করার লজিক বসাতে পারেন
    let productId = "12345";
    let quantity = 1;
    let pendingAction = null;

    // ১. অর্ডার হ্যান্ডলার
    function handleOrderNow() {
      if (!isUserLoggedIn) {
        openLoginModal('order');
      } else {
        executeOrderRedirect();
      }
    }

    // ২. কার্ট হ্যান্ডলার
    function handleAddToCart() {
      if (!isUserLoggedIn) {
        openLoginModal('cart');
      } else {
        addToDatabaseCart();
      }
    }

    // ৩. রিডাইরেক্ট একশন
    function executeOrderRedirect() {
      window.location.href = `/checkout?product_id=${productId}&quantity=${quantity}`;
    }

    function addToDatabaseCart() {
      alert('প্রোডাক্ট সফলভাবে কার্টে যোগ করা হয়েছে!');
    }

    function redirectToLogin() {
      window.location.href = `/login?redirect=${encodeURIComponent(window.location.pathname)}`;
    }

    // ৪. মোডাল কন্ট্রোল ফাংশন
    function openLoginModal(action) {
      pendingAction = action;
      const modal = document.getElementById('login-modal');
      if (modal) {
        modal.classList.remove('hidden');
        modal.classList.add('flex');
      }
    }

    function closeLoginModal() {
      const modal = document.getElementById('login-modal');
      if (modal) {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
      }
    }

    // ৫. ফর্ম সাবমিশন (AJAX)
    document.addEventListener('DOMContentLoaded', () => {
      const loginForm = document.getElementById('popup-login-form');
      if (loginForm) {
        loginForm.addEventListener('submit', async function(e) {
          e.preventDefault();

          const email = document.getElementById('modal-email').value.trim();
          const password = document.getElementById('modal-password').value.trim();
          const loginBtn = document.getElementById('modal-login-btn');

          if (!email || !password) {
            alert('ইমেইল এবং পাসওয়ার্ড দিন!');
            return;
          }

          if (loginBtn) {
            loginBtn.innerText = 'Signing in...';
            loginBtn.disabled = true;
          }

          try {
            const response = await fetch('/user/cslogin-ajax', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (data.success) {
              isUserLoggedIn = true;
              closeLoginModal();
              
              if (pendingAction === 'order') {
                executeOrderRedirect();
              } else if (pendingAction === 'cart') {
                addToDatabaseCart();
              } else {
                alert('লগইন সফল হয়েছে!');
              }
            } else {
              alert(data.message || 'লগইন ব্যর্থ হয়েছে!');
            }
          } catch (error) {
            console.error('Login error:', error);
            alert('লগইন করার সময় সমস্যা হয়েছে। আবার চেষ্টা করুন।');
          } finally {
            if (loginBtn) {
              loginBtn.innerText = 'Sign In';
              loginBtn.disabled = false;
            }
          }
        });
      }
    });
  </script>
</body>
</html>
