<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Account Profile & Address Settings</title>

  <!-- Tailwind CSS Script -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { font-family: 'Plus Jakarta Sans', sans-serif; }
    body {
      background: linear-gradient(135deg, #fdf2f8 0%, #fce7f3 50%, #f3e8ff 100%);
    }
  </style>
</head>
<body class="text-slate-700 min-h-screen pb-12">

  <header class="bg-white/80 backdrop-blur-md border-b border-pink-100 sticky top-0 z-30 shadow-sm">
    <div class="max-w-5xl mx-auto px-4 py-4 flex items-center justify-between">
      <a href="javascript:history.back()" class="text-pink-600 hover:text-pink-800 font-medium text-xs sm:text-sm flex items-center gap-2 transition">
        <i class="fa-solid fa-arrow-left"></i> Back
      </a>
      <h1 class="text-sm sm:text-base font-bold text-slate-800 tracking-wide">Profile Settings</h1>
      <div class="w-10"></div>
    </div>
  </header>

  <main class="max-w-5xl mx-auto px-4 mt-8 space-y-6">

    <!-- Profile Top Summary Header -->
    <section class="bg-white/90 backdrop-blur-sm rounded-3xl border border-pink-100 shadow-xl shadow-pink-100/50 p-6 sm:p-8 flex flex-col sm:flex-row items-center gap-6">
      <div class="relative group">
        <img id="display-profile-img" 
             src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120' viewBox='0 0 120 120'><rect width='100%' height='100%' fill='%23fbcfe8'/><text x='50%' y='50%' font-family='sans-serif' font-size='14' fill='%23db2777' text-anchor='middle' dy='.3em'>Profile</text></svg>" 
             alt="Profile Avatar" 
             class="w-28 h-28 object-cover rounded-full border-4 border-white shadow-md">
        
        <label for="image-upload-input" class="absolute bottom-1 right-1 bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white w-9 h-9 rounded-full flex items-center justify-center cursor-pointer transition shadow-lg" title="Upload Photo">
          <i class="fa-solid fa-camera text-xs"></i>
        </label>
        <input type="file" id="image-upload-input" accept="image/*" class="hidden" onchange="uploadProfilePicture(event)">
      </div>

      <div class="text-center sm:text-left space-y-2 flex-1">
        <div class="flex flex-col sm:flex-row sm:items-center gap-2 justify-center sm:justify-start">
          <h2 id="display-name" class="text-2xl font-extrabold text-slate-800">Loading...</h2>
          <span class="inline-flex items-center gap-1.5 bg-pink-50 border border-pink-200 text-pink-600 text-[11px] font-semibold px-3 py-1 rounded-full w-max mx-auto sm:mx-0 shadow-sm">
            <i class="fa-solid fa-sparkles text-pink-500 text-[10px]"></i> Account Profile
          </span>
        </div>
        
        <p class="text-xs sm:text-sm text-slate-500 font-medium flex items-center justify-center sm:justify-start gap-2 pt-1">
          <i class="fa-solid fa-envelope text-pink-400"></i> <span id="text-email-val">--</span>
        </p>

        <p class="text-xs sm:text-sm text-slate-500 font-medium flex items-center justify-center sm:justify-start gap-2">
          <i class="fa-solid fa-phone text-pink-400"></i> <span id="text-phone-val">--</span>
        </p>
      </div>
    </section>

    <!-- NEW DESIGN: Live Overview Cards (Displays User Info & Shipping Address together) -->
    <section class="grid grid-cols-1 md:grid-cols-2 gap-5">
      <!-- User Summary Card -->
      <div class="bg-white/90 backdrop-blur-sm rounded-3xl border border-pink-100 p-6 shadow-lg shadow-pink-100/30 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-20 h-20 bg-pink-100/50 rounded-bl-full -z-0"></div>
        <div class="relative z-10 space-y-3">
          <div class="flex items-center gap-2 text-pink-600 font-bold text-xs uppercase tracking-wider">
            <i class="fa-solid fa-id-card text-sm"></i> Personal Overview
          </div>
          <div class="space-y-1.5 pt-1">
            <p class="text-sm font-bold text-slate-800" id="card-name">--</p>
            <p class="text-xs text-slate-500 flex items-center gap-2">
              <i class="fa-regular fa-envelope text-pink-400 w-4"></i> <span id="card-email">--</span>
            </p>
            <p class="text-xs text-slate-500 flex items-center gap-2">
              <i class="fa-solid fa-mobile-screen text-pink-400 w-4"></i> <span id="card-phone">--</span>
            </p>
          </div>
        </div>
      </div>

      <!-- Shipping Address Summary Card -->
      <div class="bg-white/90 backdrop-blur-sm rounded-3xl border border-pink-100 p-6 shadow-lg shadow-pink-100/30 relative overflow-hidden">
        <div class="absolute top-0 right-0 w-20 h-20 bg-rose-100/50 rounded-bl-full -z-0"></div>
        <div class="relative z-10 space-y-3">
          <div class="flex items-center gap-2 text-rose-600 font-bold text-xs uppercase tracking-wider">
            <i class="fa-solid fa-truck-fast text-sm"></i> Active Shipping Address
          </div>
          <div class="space-y-1.5 pt-1">
            <p class="text-xs font-semibold text-slate-700 flex items-start gap-2">
              <i class="fa-solid fa-location-dot text-rose-500 mt-0.5 w-4"></i> 
              <span id="card-full-address">Address not set yet.</span>
            </p>
            <p class="text-xs text-slate-500 pl-6" id="card-postcode">Post Code: --</p>
          </div>
        </div>
      </div>
    </section>

    <!-- Profile Edit Form -->
    <section class="bg-white/90 backdrop-blur-sm rounded-3xl border border-pink-100 shadow-xl shadow-pink-100/50 p-6 sm:p-10 space-y-8">
      <div class="border-b border-pink-100 pb-4">
        <h3 class="text-lg font-bold text-slate-800 flex items-center gap-2.5">
          <i class="fa-solid fa-pen-to-square text-pink-500"></i> Edit Profile Information
        </h3>
        <p class="text-xs text-slate-500 mt-1">Update your personal details and shipping address below.</p>
      </div>

      <form id="profile-form" onsubmit="updateProfileInfo(event)" class="space-y-8">
        
        <!-- Personal Details -->
        <div class="space-y-4">
          <h4 class="text-xs font-bold text-pink-600 uppercase tracking-widest flex items-center gap-2">
            <i class="fa-solid fa-user"></i> Personal Details
          </h4>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-5">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Full Name</label>
              <input type="text" id="input-name" name="name" required placeholder="Enter Full Name" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Email Address (Read Only)</label>
              <input type="email" id="input-email" name="email" readonly disabled placeholder="Email Address" class="w-full text-xs bg-gray-100 border border-gray-200 text-gray-500 cursor-not-allowed rounded-2xl p-3.5 focus:outline-none">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Phone Number</label>
              <input type="text" id="input-phone" name="phone_number" required placeholder="017XXXXXXXX" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition">
            </div>
          </div>
        </div>

        <hr class="border-pink-100">

        <!-- Shipping Address -->
        <div class="space-y-4">
          <h4 class="text-xs font-bold text-pink-600 uppercase tracking-widest flex items-center gap-2">
            <i class="fa-solid fa-location-dot"></i> Shipping & Address
          </h4>
          
          <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-4 gap-5">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Division</label>
              <select id="select-division" name="division" onchange="onDivisionChange()" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition">
                <option value="">Select Division</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">District</label>
              <select id="select-district" name="district" onchange="onDistrictChange()" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition" disabled>
                <option value="">Select District</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Upazila</label>
              <select id="select-upazilla" name="upazilla" onchange="onUpazilaChange()" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition" disabled>
                <option value="">Select Upazila</option>
              </select>
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Union</label>
              <select id="select-union" name="union_area" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition" disabled>
                <option value="">Select Union</option>
              </select>
            </div>
          </div>

          <div class="grid grid-cols-1 sm:grid-cols-2 gap-5 pt-2">
            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">Post Code</label>
              <input type="text" id="input-postcode" name="post_code" placeholder="e.g. 1205" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition">
            </div>

            <div>
              <label class="block text-xs font-semibold text-slate-700 mb-2">House / Road / Street</label>
              <input type="text" id="input-blockhouse" name="block_house" placeholder="House #12, Road #04" class="w-full text-xs bg-pink-50/40 border border-pink-100 rounded-2xl p-3.5 focus:bg-white focus:outline-none focus:border-pink-400 focus:ring-2 focus:ring-pink-100 transition">
            </div>
          </div>
        </div>

        <div class="pt-6 border-t border-pink-100 flex justify-end">
          <button type="submit" id="save-btn" class="bg-gradient-to-r from-pink-500 to-rose-500 hover:from-pink-600 hover:to-rose-600 text-white text-xs font-bold px-8 py-4 rounded-2xl shadow-lg shadow-pink-200 transition flex items-center gap-2">
            <i class="fa-solid fa-heart"></i> Save Changes
          </button>
        </div>

      </form>
    </section>
  </main>

  <script>
    const API_BASE = 'https://bdgeoapi.rajumia.com/api/v1';

    document.addEventListener("DOMContentLoaded", async () => {
      await loadDivisionsBDAPI();
      await fetchUserProfileData();
    });

    async function fetchApiData(url) {
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error('Network error');
        const json = await res.json();
        return json.results || json.data || json;
      } catch (err) {
        console.error("API Fetch Error:", err);
        return [];
      }
    }

    async function loadDivisionsBDAPI() {
      const data = await fetchApiData(`${API_BASE}/divisions/`);
      const divisionSelect = document.getElementById('select-division');
      divisionSelect.innerHTML = '<option value="">Select Division</option>';

      if (Array.isArray(data)) {
        data.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.innerText = item.name || item.bn_name || item.division;
          divisionSelect.appendChild(opt);
        });
      }
    }

    async function onDivisionChange() {
      const divisionId = document.getElementById('select-division').value;
      const districtSelect = document.getElementById('select-district');
      const upazillaSelect = document.getElementById('select-upazilla');
      const unionSelect = document.getElementById('select-union');

      districtSelect.innerHTML = '<option value="">Loading...</option>';
      upazillaSelect.innerHTML = '<option value="">Select Upazila</option>';
      unionSelect.innerHTML = '<option value="">Select Union</option>';

      districtSelect.disabled = true;
      upazillaSelect.disabled = true;
      unionSelect.disabled = true;

      if (!divisionId) {
        districtSelect.innerHTML = '<option value="">Select District</option>';
        return;
      }

      const data = await fetchApiData(`${API_BASE}/districts/?division=${divisionId}`);
      districtSelect.innerHTML = '<option value="">Select District</option>';

      if (Array.isArray(data) && data.length > 0) {
        districtSelect.disabled = false;
        data.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.innerText = item.name || item.bn_name || item.district;
          districtSelect.appendChild(opt);
        });
      }
    }

    async function onDistrictChange() {
      const districtId = document.getElementById('select-district').value;
      const upazillaSelect = document.getElementById('select-upazilla');
      const unionSelect = document.getElementById('select-union');

      upazillaSelect.innerHTML = '<option value="">Loading...</option>';
      unionSelect.innerHTML = '<option value="">Select Union</option>';

      upazillaSelect.disabled = true;
      unionSelect.disabled = true;

      if (!districtId) {
        upazillaSelect.innerHTML = '<option value="">Select Upazila</option>';
        return;
      }

      const data = await fetchApiData(`${API_BASE}/upazilas/?district=${districtId}`);
      upazillaSelect.innerHTML = '<option value="">Select Upazila</option>';

      if (Array.isArray(data) && data.length > 0) {
        upazillaSelect.disabled = false;
        data.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.id;
          opt.innerText = item.name || item.bn_name || item.upazila;
          upazillaSelect.appendChild(opt);
        });
      }
    }

    async function onUpazilaChange() {
      const upazilaId = document.getElementById('select-upazilla').value;
      const unionSelect = document.getElementById('select-union');

      unionSelect.innerHTML = '<option value="">Loading...</option>';
      unionSelect.disabled = true;

      if (!upazilaId) {
        unionSelect.innerHTML = '<option value="">Select Union</option>';
        return;
      }

      const data = await fetchApiData(`${API_BASE}/unions/?upazila=${upazilaId}`);

      if (Array.isArray(data) && data.length > 0) {
        unionSelect.innerHTML = '<option value="">Select Union</option>';
        unionSelect.disabled = false;
        data.forEach(item => {
          const opt = document.createElement('option');
          opt.value = item.name || item.bn_name || item.union;
          opt.innerText = item.name || item.bn_name || item.union;
          unionSelect.appendChild(opt);
        });
      } else {
        unionSelect.innerHTML = '<option value="">No Unions Found</option>';
      }
    }

    async function fetchUserProfileData() {
      try {
        const response = await fetch('/user/get-user-profile');
        if (!response.ok) {
           console.error("404 Error: /user/get-user-profile endpoint not found!");
           return;
        }

        const data = await response.json();

        // Top UI & Summary Cards Populating
        document.getElementById('display-name').innerText = data.name || 'Set Your Name';
        document.getElementById('text-phone-val').innerText = data.phone_number || 'Not Set';
        document.getElementById('text-email-val').innerText = data.email || 'N/A';

        document.getElementById('card-name').innerText = data.name || 'Not Set';
        document.getElementById('card-email').innerText = data.email || 'N/A';
        document.getElementById('card-phone').innerText = data.phone_number || 'Not Set';
        document.getElementById('card-postcode').innerText = `Post Code: ${data.post_code || 'N/A'}`;

        if (data.profile_image) {
          document.getElementById('display-profile-img').src = data.profile_image;
        }

        // Form Inputs Setup
        document.getElementById('input-name').value = data.name || '';
        document.getElementById('input-email').value = data.email || '';
        document.getElementById('input-phone').value = data.phone_number || '';
        document.getElementById('input-postcode').value = data.post_code || '';
        document.getElementById('input-blockhouse').value = data.block_house || '';

        // Address Builder for Summary Card
        let fullAddrParts = [];
        if (data.block_house) fullAddrParts.push(data.block_house);
        if (data.union_area) fullAddrParts.push(data.union_area);

        if (data.division) {
          document.getElementById('select-division').value = data.division;
          await onDivisionChange();

          const divText = document.getElementById('select-division').options[document.getElementById('select-division').selectedIndex]?.text;

          if (data.district) {
            document.getElementById('select-district').value = data.district;
            await onDistrictChange();
            const distText = document.getElementById('select-district').options[document.getElementById('select-district').selectedIndex]?.text;

            if (data.upazilla) {
              document.getElementById('select-upazilla').value = data.upazilla;
              await onUpazilaChange();
              const upzText = document.getElementById('select-upazilla').options[document.getElementById('select-upazilla').selectedIndex]?.text;

              if (data.union_area) {
                document.getElementById('select-union').value = data.union_area;
              }

              if(upzText) fullAddrParts.push(upzText);
            }
            if(distText) fullAddrParts.push(distText);
          }
          if(divText) fullAddrParts.push(divText);
        }

        document.getElementById('card-full-address').innerText = fullAddrParts.length > 0 ? fullAddrParts.join(', ') : 'Shipping address not set yet.';

      } catch (err) {
        console.error("Error fetching profile:", err);
      }
    }

    async function uploadProfilePicture(event) {
      const file = event.target.files[0];
      if (!file) return;

      const formData = new FormData();
      formData.append('profile_image', file);

      try {
        const response = await fetch('/user/update-profile-picture', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.success) {
          document.getElementById('display-profile-img').src = result.profile_image;
          alert(result.message);
        } else {
          alert(result.message || 'Image upload failed!');
        }
      } catch (err) {
        alert("Server error during photo upload!");
      }
    }

    async function updateProfileInfo(event) {
      event.preventDefault();
      const btn = document.getElementById('save-btn');
      btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Saving...`;
      btn.disabled = true;

      const formData = new FormData(event.target);

      try {
        const response = await fetch('/user/update-profile', {
          method: 'POST',
          body: formData
        });

        const result = await response.json();
        if (result.success) {
          alert(result.message || 'Profile updated successfully!');
          await fetchUserProfileData();
        } else {
          alert(result.message || 'Failed to update profile!');
        }
      } catch (err) {
        alert("Server error during update!");
      } finally {
        btn.innerHTML = `<i class="fa-solid fa-heart"></i> Save Changes`;
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
