<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - NexKart</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* ------------------ BACKGROUND SECTION ------------------ */
        body {
            /* প্রিমিয়াম গ্রেডিয়েন্ট ব্যাকগ্রাউন্ড */
            background: linear-gradient(135deg, #fff5f7 0%, #ffe0e6 50%, #f9f9f9 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }

        /* ব্যাকগ্রাউন্ড গ্লো ইফেক্ট (Decorative Circles) */
        body::before {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 75, 110, 0.15);
            border-radius: 50%;
            top: -50px;
            left: -50px;
            filter: blur(80px);
            z-index: 0;
        }

        body::after {
            content: '';
            position: absolute;
            width: 350px;
            height: 350px;
            background: rgba(255, 117, 140, 0.15);
            border-radius: 50%;
            bottom: -80px;
            right: -80px;
            filter: blur(90px);
            z-index: 0;
        }

        /* ------------------ CARD STYLING ------------------ */
        .reset-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px); /* গ্লাস টাইপ ইফেক্ট */
            width: 100%;
            max-width: 420px;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(255, 75, 110, 0.08);
            border: 1px solid rgba(255, 204, 213, 0.6);
            text-align: center;
            position: relative;
            z-index: 1; /* কার্ডটি যেন ব্যাকগ্রাউন্ডের উপরে থাকে */
        }

        .icon-box {
            width: 70px;
            height: 70px;
            background: #fff5f7;
            color: #ff4b6e;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            margin: 0 auto 20px;
            border: 1px solid #ffccd5;
            box-shadow: 0 4px 12px rgba(255, 75, 110, 0.1);
        }

        .reset-card h2 {
            font-size: 22px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        .reset-card p {
            font-size: 13px;
            color: #666;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #444;
            margin-bottom: 6px;
        }

        .input-field {
            position: relative;
        }

        .input-field i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #aaa;
            font-size: 15px;
        }

        .input-field input {
            width: 100%;
            padding: 12px 15px 12px 42px;
            border: 1.5px solid #e0e0e0;
            border-radius: 10px;
            outline: none;
            font-size: 14px;
            transition: all 0.3s ease;
            background: #fff;
        }

        .input-field input:focus {
            border-color: #ff4b6e;
            box-shadow: 0 0 8px rgba(255, 75, 110, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #ff4b6e, #ff758c);
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 75, 110, 0.3);
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .btn-submit:disabled {
            background: #ccc;
            cursor: not-allowed;
            box-shadow: none;
        }

        .back-to-login {
            margin-top: 25px;
            font-size: 13px;
        }

        .back-to-login a {
            color: #ff4b6e;
            text-decoration: none;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: color 0.2s;
        }

        .back-to-login a:hover {
            color: #d63384;
            text-decoration: underline;
        }

        /* মেসেজ বা অ্যালার্ট নোটিফিকেশন */
        .alert-message {
            padding: 10px 15px;
            font-size: 13px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-success {
            background: #e8f5e9;
            color: #2e7d32;
            border: 1px solid #c8e6c9;
        }

        .alert-danger {
            background: #ffebee;
            color: #c62828;
            border: 1px solid #ffcdd2;
        }
    </style>
</head>
<body>

    <div class="reset-card">
        <div class="icon-box">
            <i class="fa-solid fa-lock"></i>
        </div>

        <h2>Forgot Password?</h2>
        <p>No worries! Enter your registered email address below, and we'll send you a password reset link.</p>

        <!-- নোটিফিকেশন মেসেজ বক্স -->
        <div id="alertBox" class="alert-message"></div>

        <form id="forgotForm">
            <div class="input-group">
                <label for="email">Email Address</label>
                <div class="input-field">
                    <i class="fa-solid fa-envelope"></i>
                    <input type="email" id="email" placeholder="example@mail.com" required>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">Send Reset Link</button>
        </form>

        <div class="back-to-login">
            <a href="/user/cslogin"><i class="fa-solid fa-arrow-left"></i> Back to Sign In</a>
        </div>
    </div>

    <script>
        const forgotForm = document.getElementById('forgotForm');
        const alertBox = document.getElementById('alertBox');
        const submitBtn = document.getElementById('submitBtn');

        forgotForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const email = document.getElementById('email').value;

            submitBtn.disabled = true;
            submitBtn.innerText = "Sending Link...";
            alertBox.style.display = 'none';

            try {
                const response = await fetch('/user/forgot-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ email })
                });

                const data = await response.json();

                if (response.ok) {
                    alertBox.className = "alert-message alert-success";
                    alertBox.innerText = data.message || "A reset link has been sent to your email!";
                    alertBox.style.display = 'block';
                    forgotForm.reset();
                } else {
                    alertBox.className = "alert-message alert-danger";
                    alertBox.innerText = data.message || "Failed to send reset link. Please try again.";
                    alertBox.style.display = 'block';
                }
            } catch (err) {
                alertBox.className = "alert-message alert-danger";
                alertBox.innerText = "Something went wrong! Please check your connection.";
                alertBox.style.display = 'block';
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerText = "Send Reset Link";
            }
        });
    </script>
</body>
</html>
