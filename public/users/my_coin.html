<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coins & Rewards Dashboard</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');
    body { 
      font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
  </style>
</head>

<body class="bg-gradient-to-br from-pink-50 via-rose-50 to-purple-50 text-gray-800 antialiased min-h-screen pb-24 md:pb-12">

  <main class="max-w-5xl mx-auto px-4 py-6 md:py-10 space-y-6">

    <!-- TOP NAVIGATION HEADER -->
    <header class="flex justify-between items-center bg-white/80 backdrop-blur-md p-4 md:p-5 rounded-2xl border border-pink-100 shadow-sm">
      <div class="flex items-center gap-3">
        <button onclick="window.history.back()" class="w-10 h-10 rounded-xl bg-pink-50 border border-pink-100 text-pink-600 flex items-center justify-center hover:bg-pink-100 active:scale-95 transition shadow-sm">
          <i class="fa-solid fa-arrow-left text-lg"></i>
        </button>
        <div class="w-10 h-10 rounded-xl bg-pink-100 text-pink-600 flex items-center justify-center text-xl font-bold">
          <i class="fa-solid fa-coins"></i>
        </div>
        <div>
          <h1 class="text-lg md:text-xl font-bold text-gray-900">মাই রিওয়ার্ডস & কয়েন</h1>
          <p class="text-xs text-gray-500 hidden sm:block">সহজেই পয়েন্ট আর্ন করুন এবং কেনাকাটায় ব্যবহার করুন</p>
        </div>
      </div>
    </header>

    <!-- HERO BANNER (DYNAMIC BALANCE & TAKA) -->
    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
      <div class="lg:col-span-2 rounded-3xl bg-gradient-to-r from-pink-500 via-rose-500 to-purple-500 p-6 md:p-8 text-white shadow-xl shadow-pink-500/20 relative overflow-hidden flex flex-col justify-between">
        <div class="absolute -right-8 -top-8 w-36 h-36 bg-white/10 rounded-full blur-xl"></div>
        
        <div>
          <div class="flex justify-between items-center mb-4">
            <span class="text-xs font-semibold uppercase tracking-wider bg-black/20 px-3.5 py-1.5 rounded-full backdrop-blur-md">
              <i class="fa-solid fa-wallet text-pink-200 mr-1.5"></i> মোট ব্যালেন্স
            </span>
            <span class="text-xs bg-white/20 px-3 py-1 rounded-full text-white font-medium">১ কয়েন = ৳০.৩০</span>
          </div>

          <div class="my-4">
            <div class="text-4xl md:text-5xl font-black tracking-tight">
              <span id="totalCoinsDisplay">0</span> <span class="text-lg md:text-xl font-normal opacity-90">Coins</span>
            </div>
            <p class="text-xs md:text-sm text-pink-100 mt-2">
              সমপরিমাণ টাকা: <span class="font-bold text-white text-base" id="equivalentTkDisplay">৳ ০.০০</span>
            </p>
          </div>
        </div>

        <div class="mt-6 pt-4 border-t border-white/20 flex flex-col sm:flex-row gap-3">
          <button class="w-full sm:w-auto px-6 py-3 bg-white text-pink-600 font-bold text-sm rounded-xl shadow active:scale-95 transition hover:bg-pink-50">
            কেনাকাটায় ব্যবহার করুন
          </button>
        </div>
      </div>

      <!-- QUICK STATS -->
      <div class="lg:col-span-1 flex flex-col justify-between gap-3">
        <div class="bg-white/80 backdrop-blur-md p-4 rounded-2xl border border-pink-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-rose-100 text-rose-500 flex items-center justify-center font-bold text-lg shrink-0">
            <i class="fa-solid fa-gift"></i>
          </div>
          <div>
            <div class="text-xs text-gray-400 font-medium">সাইন-আপ বোনাস</div>
            <div class="text-sm font-bold text-gray-800">নতুন অ্যাকাউন্টে +১০ কয়েন</div>
          </div>
        </div>

        <div class="bg-white/80 backdrop-blur-md p-4 rounded-2xl border border-pink-100 shadow-sm flex items-center gap-4">
          <div class="w-12 h-12 rounded-2xl bg-purple-100 text-purple-500 flex items-center justify-center font-bold text-lg shrink-0">
            <i class="fa-solid fa-clock-rotate-left"></i>
          </div>
          <div>
            <div class="text-xs text-gray-400 font-medium">কয়েনের মেয়াদ</div>
            <div class="text-sm font-bold text-gray-800">অর্জনের ৬ মাস পর</div>
          </div>
        </div>
      </div>
    </div>

    <!-- TRANSACTION HISTORY SECTION -->
    <div class="bg-white/80 backdrop-blur-md rounded-3xl p-6 border border-pink-100 shadow-sm">
      <div class="flex justify-between items-center mb-6">
        <div>
          <h3 class="font-bold text-lg text-gray-900">লেনদেনের ইতিহাস</h3>
          <p class="text-xs text-gray-400">আপনার সাম্প্রতিক কয়েন জমা ও মেয়াদের হিসাব</p>
        </div>
      </div>

      <div class="space-y-3" id="transactionList">
        <!-- Dynamic Transactions will load here -->
      </div>
    </div>

  </main>

  <script>
    // Fetch user coin data dynamically (Replace '1' with dynamic logged-in user id)
    async function loadUserCoins() {
      try {
        const userId = 1; // আপনার লগইন করা ইউজারের আইডি এখানে ডায়নামিক করুন
        const response = await fetch(`/api/coins/balance/${userId}`);
        const result = await response.json();

        if (result.success) {
          document.getElementById('totalCoinsDisplay').textContent = result.totalCoins;
          document.getElementById('equivalentTkDisplay').textContent = `৳ ${result.equivalentTk}`;

          const container = document.getElementById('transactionList');
          container.innerHTML = '';

          if (result.transactions.length === 0) {
            container.innerHTML = '<p class="text-center text-xs text-gray-400 py-4">কোনো লেনদেন পাওয়া যায়নি।</p>';
            return;
          }

          result.transactions.forEach(tx => {
            const isPositive = tx.coin_balance > 0;
            const bgClass = isPositive ? 'bg-emerald-50 text-emerald-600' : 'bg-rose-50 text-rose-600';
            const iconClass = isPositive ? 'fa-arrow-down' : 'fa-arrow-up';
            
            const itemHTML = `
              <div class="p-4 rounded-2xl bg-pink-50/40 hover:bg-pink-50/70 border border-pink-100 flex justify-between items-center transition">
                <div class="flex items-center gap-3.5">
                  <div class="w-10 h-10 rounded-xl ${bgClass} flex items-center justify-center text-sm font-bold">
                    <i class="fa-solid ${iconClass}"></i>
                  </div>
                  <div>
                    <div class="text-xs md:text-sm font-bold text-gray-800">${tx.coin_source}</div>
                    <div class="text-[11px] text-gray-400">${new Date(tx.coin_create_date).toLocaleString('bn-BD')}</div>
                  </div>
                </div>
                <div class="text-right">
                  <span class="text-sm font-bold ${isPositive ? 'text-emerald-600' : 'text-rose-500'}">
                    ${isPositive ? '+' : ''}${tx.coin_balance} Coins
                  </span>
                  <div class="text-[10px] text-gray-400">${isPositive ? 'সফলভাবে জমা হয়েছে' : 'মেয়াদ উত্তীর্ণ'}</div>
                </div>
              </div>
            `;
            container.innerHTML += itemHTML;
          });
        }
      } catch (error) {
        console.error('Failed to load coin data:', error);
      }
    }

    loadUserCoins();
  </script>

</body>
</html>
