  <style>

:root{--pink:#f71964;--rose:#e11d48;--ink:#242238;--muted:#667085}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 90% 0%,#ffd7e5,transparent 33%),linear-gradient(135deg,#fff8fb,#fff0f5);font-family:Poppins,'Segoe UI',sans-serif;color:var(--ink);padding:32px 20px}
.container{max-width:1250px;margin:auto}.header-bar{display:flex;align-items:center;gap:24px;margin-bottom:28px;flex-wrap:wrap}.back-btn{display:inline-flex;align-items:center;gap:9px;padding:12px 20px;border-radius:100px;background:#fff;color:var(--pink);font-weight:700;text-decoration:none;box-shadow:0 5px 18px #bc2b5830;border:1px solid #ffe2eb}.back-btn:hover{background:#fff1f5}.page-title{font-size:clamp(25px,3vw,38px);color:#d91450;font-weight:800;letter-spacing:-.8px}.coupon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.coupon-card{display:flex;min-height:220px;overflow:hidden;background:#fff;border-radius:22px;border:1px solid #ffe3eb;box-shadow:0 12px 28px #c42b5720;transition:transform .2s,box-shadow .2s}.coupon-card:hover{transform:translateY(-4px);box-shadow:0 16px 32px #c42b5730}.coupon-left{position:relative;flex:0 0 38%;min-width:0;background:linear-gradient(135deg,#ff477e,#f71964);color:white;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:24px 12px;isolation:isolate}.coupon-left:before,.coupon-left:after{content:'';position:absolute;right:-11px;width:22px;height:22px;border-radius:50%;background:#fff;z-index:2}.coupon-left:before{top:-11px}.coupon-left:after{bottom:-11px}.coupon-left.expired-bg{background:linear-gradient(135deg,#b3b5c0,#828593)}.discount-amount{font-size:clamp(28px,3vw,42px);font-weight:800;line-height:1.1;overflow-wrap:anywhere}.off-text{font-size:17px;font-weight:800;letter-spacing:2px;margin-top:4px}.scope-badge{max-width:95%;padding:7px 10px;border-radius:30px;border:1px solid #ffffffaa;background:#ffffff24;font-size:11px;font-weight:700;margin-top:16px;overflow-wrap:anywhere}.coupon-right{flex:1;min-width:0;padding:23px 22px;display:flex;flex-direction:column;justify-content:space-between;gap:12px}.product-title{display:block;font-size:17px;font-weight:750;color:#202338;text-decoration:none;overflow-wrap:anywhere}.product-title:hover{color:var(--rose)}.price-box{margin-top:10px;font-size:15px}.old-price{color:#9296a2;text-decoration:line-through;margin-right:10px}.new-price{color:#0c9c52;font-size:18px;font-weight:800}.save-tag{color:#f71964;font-weight:700;font-size:13px;margin-top:5px}.coupon-expiry{font-size:12px;font-weight:600;margin-top:10px}.text-active{color:#64748b}.text-expired{color:#a63b55}.coupon-action{display:flex;gap:10px;align-items:center;margin-top:8px}.coupon-code{flex:1;min-width:0;display:block;text-align:center;overflow-wrap:anywhere;padding:11px 7px;border:1px dashed #ff89ad;background:#fff7fa;border-radius:10px;font-size:13px;font-weight:800;color:#242238}.copy-btn{background:var(--pink);color:white;border:0;border-radius:10px;padding:12px 17px;font-size:13px;font-weight:700;cursor:pointer}.copy-btn:hover{background:#d60c4d}.copy-btn:disabled{background:#999ba7;cursor:not-allowed}.coupon-card.expired{opacity:.78}.coupon-card.expired .coupon-left{filter:grayscale(1)}.state-message{grid-column:1/-1;background:white;border:1px solid #ffe0e8;padding:24px;border-radius:16px;color:#8b2145}
@media(max-width:850px){.coupon-grid{grid-template-columns:1fr}.coupon-card{min-height:200px}}@media(max-width:480px){body{padding:20px 12px}.header-bar{gap:12px}.page-title{font-size:25px}.coupon-left{flex-basis:35%;padding:15px 7px}.coupon-right{padding:16px 12px}.discount-amount{font-size:26px}.off-text{font-size:13px}.scope-badge{font-size:9px}.product-title{font-size:14px}.price-box{font-size:12px}.new-price{font-size:15px}.coupon-action{gap:6px}.copy-btn{padding:11px 10px;font-size:12px}.coupon-code{font-size:11px}}

  <header class="container">
    <div class="header-bar">
      <!-- Back Button: আগের পেজে ফেরার জন্য -->
      <a href="javascript:history.back()" class="back-btn" aria-label="Go back">
        <span aria-hidden="true">←</span> Back
      </a>
      <h1 class="page-title">🌸 My Coupons</h1>
    </div>
  </header>

  <main class="container">
    <section class="coupon-grid" id="couponContainer" aria-label="Available Coupons List">
      <p style="color: #9f1239;">Loading your special offer coupons...</p>
    </section>
  </main>

  <script>
    async function fetchCoupons() {
      const container = document.getElementById('couponContainer');
      try {
        const response = await fetch('/my-coupons'); 

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          const errMsg = (data && data.error) ? data.error : (data && data.message ? data.message : response.statusText);
          throw new Error(`Server Error (${response.status}): ${errMsg}`);
        }

        if (data && data.success && data.coupons.length > 0) {
          container.innerHTML = '';

          data.coupons.forEach(coupon => {
            const dateFormatted = coupon.expiry_date 
              ? new Date(coupon.expiry_date).toLocaleDateString('en-GB') 
              : 'N/A';

            let priceHTML = '';
            if (!coupon.is_expired && coupon.original_price > 0) {
              priceHTML = `
                <div class="price-box">
                  <span>Price: </span>
                  <span class="old-price">৳${coupon.original_price}</span>
                  <span class="new-price">৳${coupon.final_price}</span>
                  <div class="save-tag">✨ You Save: ৳${coupon.discount_amount}</div>
                </div>
              `;
            }

            const statusHTML = coupon.is_expired 
              ? `<span class="text-expired">❌ Status: EXPIRED (${coupon.status_reason})</span>`
              : `<span class="text-active">⏳ Valid Till: ${dateFormatted}</span>`;

            // Dynamic Product Details Page Link Setup
            const targetId = coupon.product_id || '';
            const productLink = targetId 
              ? `/user/product-details?id=${targetId}&t=${new Date().getTime()}` 
              : '#';

            const couponCard = `
              <article class="coupon-card ${coupon.is_expired ? 'expired' : ''}">
                <div class="coupon-left ${coupon.is_expired ? 'expired-bg' : ''}">
                  <div class="discount-amount">৳${coupon.discount_amount}</div>
                  <div class="off-text">OFF</div>
                  <span class="scope-badge">${coupon.coupon_scope}</span>
                </div>
                <div class="coupon-right">
                  <div>
                    <a href="${productLink}" class="product-title">${coupon.product_name}</a>
                    ${priceHTML}
                    <div class="coupon-expiry">${statusHTML}</div>
                  </div>
                  <div class="coupon-action">
                    <span class="coupon-code" id="code_${coupon.id}">${coupon.coupon_name}</span>
                    <button type="button" class="copy-btn" ${coupon.is_expired ? 'disabled' : ''} onclick="copyCode('code_${coupon.id}', this)">${coupon.is_expired ? 'Expired' : 'Copy'}</button>
                  </div>
                </div>
              </article>
            `;

            container.innerHTML += couponCard;
          });
        } else {
          container.innerHTML = '<p style="color: #881337;">No coupons found for you right now.</p>';
        }
      } catch (error) {
        console.error('Error fetching coupons:', error);
        container.innerHTML = `<p style="color:#e11d48; font-weight: bold; padding: 12px; background: #ffe4e6; border-radius: 10px;">${error.message}</p>`;
      }
    }

    function copyCode(elementId, btn) {
      const codeText = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(codeText);
      btn.innerText = "Copied! 💕";
      setTimeout(() => { btn.innerText = "Copy"; }, 2000);
    }

    window.onload = fetchCoupons;
  </script>

</body>
