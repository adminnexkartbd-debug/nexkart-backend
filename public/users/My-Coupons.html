  <meta name="description" content="Check and claim your personal discount coupons, promo codes, and special offers on your NexKartBD profile.">

  <meta property="og:description" content="View your available discount codes and save on your purchases.">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.nexkartbd.com/user/My-Coupons.html">

  <style>

:root{--pink:#e11d48;--pink2:#fb7185;--ink:#3d1527;--muted:#806775;--line:#f8dbe3;--surface:#fff;--bg:#fff7fa}
*{box-sizing:border-box;margin:0;padding:0;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;background:radial-gradient(circle at 85% 0%,#ffe2ed 0,transparent 38%),linear-gradient(145deg,#fff9fb,#fff0f5);color:var(--ink);padding:clamp(18px,3.5vw,44px) 16px}
.container{max-width:1140px;margin:auto}
.header-bar{display:flex;align-items:center;gap:20px;margin-bottom:28px;flex-wrap:wrap}
.back-btn{display:inline-flex;align-items:center;gap:8px;padding:11px 19px;border-radius:13px;background:white;border:1px solid var(--line);color:var(--pink);font-size:14px;font-weight:700;text-decoration:none;box-shadow:0 4px 16px #a5274820;transition:.2s}
.back-btn:hover{background:#fff0f4;transform:translateX(-2px)}
.page-title{font-size:clamp(25px,3vw,34px);letter-spacing:-.8px;color:#95143d;font-weight:800}
.coupon-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;align-items:start}
.coupon-card{display:flex;position:relative;overflow:hidden;min-width:0;min-height:205px;border:1px solid #f8e0e7;border-radius:21px;background:white;box-shadow:0 10px 35px #aa31501a;transition:transform .25s,box-shadow .25s}
.coupon-card:hover{transform:translateY(-4px);box-shadow:0 17px 42px #aa31502b}
.coupon-card.expired{opacity:.7;filter:grayscale(.75)}
.coupon-left{width:34%;min-width:128px;padding:24px 12px;background:linear-gradient(150deg,#ff7190,#e11d48 75%);color:white;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;position:relative}
.coupon-left:after{content:'';position:absolute;right:-1px;top:0;height:100%;border-right:2px dashed #fff9}
.coupon-left.expired-bg{background:linear-gradient(150deg,#a7b1c0,#68788b)}
.discount-amount{font-size:clamp(25px,2.8vw,34px);font-weight:850;letter-spacing:-1px;overflow-wrap:anywhere}
.off-text{font-size:13px;font-weight:800;letter-spacing:2px;margin-top:4px}
.scope-badge{max-width:100%;overflow-wrap:anywhere;margin-top:13px;border-radius:20px;padding:6px 9px;background:#ffffff32;font-size:10px;font-weight:700;text-transform:uppercase}
.coupon-right{width:66%;min-width:0;padding:21px;display:flex;flex-direction:column;justify-content:space-between;gap:14px}
.product-title{font-size:16px;font-weight:800;line-height:1.4;color:#48162b;text-decoration:none;display:block;margin-bottom:10px;overflow-wrap:anywhere}
.product-title:hover{color:var(--pink)}
.price-box{font-size:13px;margin-bottom:11px;line-height:1.7}.old-price{text-decoration:line-through;color:#a48a95;margin-right:7px}.new-price{font-weight:800;color:#168448;font-size:16px}.save-tag{font-size:12px;font-weight:700;color:var(--pink)}
.coupon-expiry{font-size:12px;font-weight:700;line-height:1.5}.text-expired{color:#df3657}.text-active{color:#188650}
.coupon-action{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px dashed #f2a8bd;background:#fff5f8;padding:7px;border-radius:12px;min-width:0}
.coupon-code{font-family:ui-monospace,Consolas,monospace;font-size:12px;font-weight:800;overflow-wrap:anywhere;padding-left:7px;color:#87123a}
.copy-btn{border:0;border-radius:9px;padding:10px 14px;background:var(--pink);color:white;font-size:12px;font-weight:800;cursor:pointer;white-space:nowrap;transition:.2s}
.copy-btn:hover:not(:disabled){background:#bd123b}.copy-btn:disabled{background:#aeb6c1;cursor:not-allowed}
.coupon-card::before,.coupon-card::after{content:'';position:absolute;z-index:2;width:20px;height:20px;background:#fff5f9;border-radius:50%;left:calc(34% - 10px)}
.coupon-card::before{top:-10px}.coupon-card::after{bottom:-10px}
@media(max-width:850px){.coupon-grid{grid-template-columns:1fr;max-width:650px;margin:auto}.header-bar{max-width:650px;margin:0 auto 25px}}
@media(max-width:480px){body{padding:18px 12px}.header-bar{gap:13px}.page-title{font-size:25px}.coupon-card{min-height:190px}.coupon-left{width:34%;min-width:105px;padding:15px 7px}.coupon-right{padding:14px;width:66%;gap:9px}.product-title{font-size:14px}.discount-amount{font-size:25px}.scope-badge{font-size:9px}.coupon-code{font-size:11px;padding-left:3px}.copy-btn{padding:9px 10px}.coupon-card::before,.coupon-card::after{left:calc(34% - 10px)}}
@media(max-width:350px){.coupon-action{flex-wrap:wrap}.copy-btn{width:100%}}

<body>

  <!-- Google Tag Manager (noscript) -->
<noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-PCP7CR73"
height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
<!-- End Google Tag Manager (noscript) -->

  <header class="container">
    <div class="header-bar">
      <!-- Back Button: আগের পেজে ফেরার জন্য -->
      <a href="/user/dashboard" onclick="if (history.length > 1) { history.back(); return false; }" class="back-btn" aria-label="Go back">
        <span aria-hidden="true">←</span> Back
      </a>
      <h1 class="page-title">🌸 My Coupons</h1>
    </div>
  </header>

  <main class="container">
    <section class="coupon-grid" id="couponContainer" aria-label="Available Coupons List">
      <p style="color: #9f1239;">Loading your special offer coupons...</p>
    </section>
  </main>

  <script>
    async function fetchCoupons() {
      const container = document.getElementById('couponContainer');
      try {
        const response = await fetch('/my-coupons'); 

        const data = await response.json().catch(() => null);

        if (!response.ok) {
          const errMsg = (data && data.error) ? data.error : (data && data.message ? data.message : response.statusText);
          throw new Error(`Server Error (${response.status}): ${errMsg}`);
        }

        if (data && data.success && data.coupons.length > 0) {
          container.innerHTML = '';

          data.coupons.forEach(coupon => {
            const dateFormatted = coupon.expiry_date 
              ? new Date(coupon.expiry_date).toLocaleDateString('en-GB') 
              : 'N/A';

            let priceHTML = '';
            if (!coupon.is_expired && coupon.original_price > 0) {
              priceHTML = `
                <div class="price-box">
                  <span>Price: </span>
                  <span class="old-price">৳${coupon.original_price}</span>
                  <span class="new-price">৳${coupon.final_price}</span>
                  <div class="save-tag">✨ You Save: ৳${coupon.discount_amount}</div>
                </div>
              `;
            }

            const statusHTML = coupon.is_expired 
              ? `<span class="text-expired">❌ Status: EXPIRED (${coupon.status_reason})</span>`
              : `<span class="text-active">⏳ Valid Till: ${dateFormatted}</span>`;

            // Dynamic Product Details Page Link Setup
            const targetId = coupon.product_id || '';
            const productLink = targetId 
              ? `/user/product-details?id=${targetId}&t=${new Date().getTime()}` 
              : '#';

            const couponCard = `
              <article class="coupon-card ${coupon.is_expired ? 'expired' : ''}">
                <div class="coupon-left ${coupon.is_expired ? 'expired-bg' : ''}">
                  <div class="discount-amount">৳${coupon.discount_amount}</div>
                  <div class="off-text">OFF</div>
                  <span class="scope-badge">${coupon.coupon_scope}</span>
                </div>
                <div class="coupon-right">
                  <div>
                    <a href="${productLink}" class="product-title">🛍️ ${coupon.product_name}</a>
                    ${priceHTML}
                    <div class="coupon-expiry">${statusHTML}</div>
                  </div>
                  <div class="coupon-action">
                    <span class="coupon-code" id="code_${coupon.id}">${coupon.coupon_name}</span>
                    <button 
                      class="copy-btn" 
                      ${coupon.is_expired ? 'disabled' : ''} 
                      onclick="copyCode('code_${coupon.id}', this)">
                      ${coupon.is_expired ? 'Expired' : 'Copy'}
                    </button>
                  </div>
                </div>
              </article>
            `;

            container.innerHTML += couponCard;
          });
        } else {
          container.innerHTML = '<p style="color: #881337;">No coupons found for you right now.</p>';
        }
      } catch (error) {
        console.error('Error fetching coupons:', error);
        container.innerHTML = `<p style="color:#e11d48; font-weight: bold; padding: 12px; background: #ffe4e6; border-radius: 10px;">${error.message}</p>`;
      }
    }

    function copyCode(elementId, btn) {
      const codeText = document.getElementById(elementId).innerText;
      navigator.clipboard.writeText(codeText);
      btn.innerText = "Copied! 💕";
      setTimeout(() => { btn.innerText = "Copy"; }, 2000);
    }

    window.onload = fetchCoupons;
  </script>

</body>
</html>
