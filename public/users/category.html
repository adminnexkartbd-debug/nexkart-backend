<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexKart - Category Products</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary-gradient: linear-gradient(135deg, #ff4b6e 0%, #ff758c 100%);
            --primary-color: #ff4b6e;
            --primary-light: #fff5f7;
            --accent-pink: #ffccd5;
            --text-dark: #2d3436;
            --text-muted: #636e72;
            --bg-light: #f8f9fa;
            --white: #ffffff;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: var(--bg-light); color: var(--text-dark); }

        /* HEADER & SUB BAR */
        .top-header {
            background: rgba(255, 255, 255, 0.95);
            padding: 14px 50px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.03);
            position: sticky; top: 0; z-index: 1000;
        }
        .header-logo img { height: 40px; }
        .search-box {
            flex: 1.5; max-width: 600px; display: flex; align-items: center;
            background: #fdfdfd; border: 2px solid var(--accent-pink);
            border-radius: 50px; padding: 6px 20px;
        }
        .search-box input { flex: 1; border: none; background: transparent; outline: none; font-size: 14px; }
        .search-box button { background: transparent; border: none; color: var(--primary-color); cursor: pointer; }

        /* PRODUCT GRID (DASHBOARD MATCHED) */
        .products-section { padding: 40px 50px; }
        .category-title { font-size: 24px; font-weight: 700; color: var(--text-dark); margin-bottom: 25px; text-transform: capitalize; }
        
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: var(--white);
            border-radius: 16px;
            padding: 16px;
            border: 1px solid #eee;
            box-shadow: 0 5px 20px rgba(0,0,0,0.02);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            cursor: pointer;
        }

        .product-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 30px rgba(255, 75, 110, 0.15);
        }

        .promo-badge {
            position: absolute;
            top: 12px; left: 12px;
            background: var(--primary-gradient);
            color: var(--white);
            font-size: 10px; font-weight: 700;
            padding: 4px 10px; border-radius: 20px;
            text-transform: uppercase; z-index: 2;
        }

        .product-img-box {
            width: 100%; height: 180px;
            border-radius: 12px; overflow: hidden;
            display: flex; align-items: center; justify-content: center;
            background: #fafafa; margin-bottom: 12px;
        }

        .product-img-box img {
            max-width: 100%; max-height: 100%; object-fit: contain;
            transition: var(--transition);
        }

        .product-card:hover .product-img-box img {
            transform: scale(1.06);
        }

        .product-title {
            font-size: 14px; font-weight: 600; color: var(--text-dark);
            margin-bottom: 6px; line-height: 1.4;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }

        .rating-box {
            display: flex; align-items: center; gap: 6px;
            margin-bottom: 8px; font-size: 12px; color: #ffa800;
        }

        .rating-box span { color: var(--text-muted); font-size: 11px; }

        .price-box {
            display: flex; align-items: baseline; gap: 8px; margin-bottom: 12px;
        }

        .sale-price { font-size: 17px; font-weight: 700; color: var(--primary-color); }
        .regular-price { font-size: 12px; color: #a4b0be; text-decoration: line-through; }

        .btn-add-cart {
            width: 100%; background: var(--primary-gradient); color: var(--white);
            border: none; padding: 10px; border-radius: 10px; font-size: 13px;
            font-weight: 600; cursor: pointer; transition: var(--transition);
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }

        .btn-add-cart:hover { opacity: 0.9; transform: translateY(-2px); }

        .load-more-container { text-align: center; margin-top: 30px; }
        .btn-load-more {
            background: var(--white); border: 2px solid var(--primary-color);
            color: var(--primary-color); padding: 10px 30px; border-radius: 25px;
            font-weight: 600; cursor: pointer; transition: var(--transition);
        }
        .btn-load-more:hover { background: var(--primary-color); color: var(--white); }
    </style>
</head>
<body>

    <header class="top-header">
        <div class="header-logo">
            <a href="/user/dashboard"><img src="/images/nexkartbd-logo.png" alt="NexKart Logo"></a>
        </div>
        <div class="search-box">
            <input type="text" id="searchInput" placeholder="Search category products...">
            <button id="searchBtn"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
    </header>

    <main class="products-section">
        <h2 class="category-title" id="pageTitle">Products</h2>
        <div class="product-grid" id="categoryProductsGrid"></div>
        
        <div class="load-more-container">
            <button id="loadMoreBtn" class="btn-load-more" style="display: none;">Load More</button>
        </div>
    </main>

    <script>
        let currentPage = 1;
        const limit = 8;
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('cat') || urlParams.get('type') || 'all';
        const promo = urlParams.get('promo') || '';
        const search = urlParams.get('search') || '';

        document.getElementById('pageTitle').innerText = search ? `Search Results for "${search}"` : (promo ? `Promo: ${promo.replace('_', ' ')}` : `Category: ${category}`);

        async function fetchCategoryProducts(page = 1) {
            try {
                let apiURL = `/user/get-products-by-category?page=${page}&limit=${limit}`;
                if (category && category !== 'all') apiURL += `&cat=${encodeURIComponent(category)}`;
                if (promo) apiURL += `&promo=${encodeURIComponent(promo)}`;
                if (search) apiURL += `&search=${encodeURIComponent(search)}`;

                const res = await fetch(apiURL);
                const data = await res.json();

                if (data.success) {
                    renderProducts(data.products, page === 1);
                    const loadMoreBtn = document.getElementById('loadMoreBtn');
                    if (data.hasMore) {
                        loadMoreBtn.style.display = 'inline-block';
                    } else {
                        loadMoreBtn.style.display = 'none';
                    }
                }
            } catch (err) {
                console.error("Error fetching category products:", err);
            }
        }

        function renderProducts(products, isFirstPage) {
            const grid = document.getElementById('categoryProductsGrid');
            if (isFirstPage) grid.innerHTML = '';

            if (products.length === 0 && isFirstPage) {
                grid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted);">No products found in this category.</p>';
                return;
            }

            products.forEach(p => {
                const imgPath = p.primary_image || (p.images ? `/uploads/${p.images.split(',')[0]}` : '/images/placeholder.png');
                const avgRating = parseFloat(p.avg_rating || 0).toFixed(1);
                const reviewCount = p.review_count || 0;
                const promoBadge = p.promo_badge ? `<span class="promo-badge">${p.promo_badge}</span>` : '';

                let stars = '';
                for (let i = 1; i <= 5; i++) {
                    if (i <= Math.round(avgRating)) {
                        stars += '<i class="fa-solid fa-star"></i>';
                    } else {
                        stars += '<i class="fa-regular fa-star"></i>';
                    }
                }

                const cardHTML = `
                    <div class="product-card" onclick="window.location.href='/user/product-details?id=${p.id}'">
                        ${promoBadge}
                        <div class="product-img-box">
                            <img src="${imgPath}" alt="${p.title}">
                        </div>
                        <div class="product-info">
                            <h3 class="product-title">${p.title}</h3>
                            <div class="rating-box">
                                ${stars}
                                <span>(${reviewCount})</span>
                            </div>
                            <div class="price-box">
                                <span class="sale-price">৳${p.sale_price}</span>
                                ${p.regular_price ? `<span class="regular-price">৳${p.regular_price}</span>` : ''}
                            </div>
                        </div>
                        <button class="btn-add-cart" onclick="event.stopPropagation(); addToCart(${p.id})">
                            <i class="fa-solid fa-cart-shopping"></i> Add to Cart
                        </button>
                    </div>
                `;
                grid.insertAdjacentHTML('beforeend', cardHTML);
            });
        }

        async function addToCart(productId) {
            try {
                const res = await fetch('/user/add-to-cart', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ product_id: productId, quantity: 1 })
                });
                const data = await res.json();
                if (data.success) {
                    alert('Product added to cart!');
                } else {
                    if (res.status === 401) {
                        window.location.href = '/user/cslogin';
                    } else {
                        alert(data.message || 'Failed to add item');
                    }
                }
            } catch (err) {
                console.error("Cart error:", err);
            }
        }

        document.getElementById('loadMoreBtn').addEventListener('click', () => {
            currentPage++;
            fetchCategoryProducts(currentPage);
        });

        document.getElementById('searchBtn').addEventListener('click', () => {
            const query = document.getElementById('searchInput').value.trim();
            if (query) {
                window.location.href = `/user/category.html?search=${encodeURIComponent(query)}`;
            }
        });

        // Initial Load
        fetchCategoryProducts(1);
    </script>
</body>
</html>
