<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report IPR Infringement - NexKart</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background-color: #fff0f5; min-height: 100vh; padding: 30px 20px; }
        .container { background: #ffffff; width: 100%; max-width: 1100px; margin: 0 auto 40px auto; padding: 35px; border-radius: 20px; box-shadow: 0 10px 30px rgba(230, 100, 150, 0.15); border: 1px solid #fcddec; }
        
        /* Dynamic Back Button Styling */
        .back-btn-container { margin-bottom: 20px; }
        .back-btn { display: inline-flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; color: #d63384; background: #ffe6f0; padding: 8px 16px; border-radius: 8px; border: none; cursor: pointer; transition: 0.3s; }
        .back-btn:hover { background: #ffd1e3; }

        .header { text-align: center; margin-bottom: 25px; }
        .header i { font-size: 40px; color: #d63384; margin-bottom: 10px; }
        .header h2 { color: #d63384; font-size: 24px; font-weight: 700; }
        .header p { color: #666; font-size: 13px; margin-top: 5px; }
        .form-group { margin-bottom: 18px; }
        .form-group label { display: block; font-size: 13px; font-weight: 600; color: #4a3e45; margin-bottom: 6px; }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 12px; border: 1.5px solid #f3b0cd; border-radius: 10px; font-size: 13px; outline: none; background: #fffafc; }
        .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: #d63384; }
        .submit-btn { width: 100%; background: #e83e8c; color: white; padding: 13px; border: none; border-radius: 10px; font-size: 15px; font-weight: 600; cursor: pointer; transition: 0.3s; }
        .submit-btn:hover { background: #d63384; }

        .table-section { margin-top: 40px; }
        .table-responsive { overflow-x: auto; margin-top: 15px; }
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: 12px 10px; font-size: 13px; border-bottom: 1px solid #fcddec; }
        th { background-color: #ffe6f0; color: #d63384; font-weight: 600; }
        tr:hover { background-color: #fffafc; }
        .url-link { color: #d63384; text-decoration: none; max-width: 150px; display: inline-block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .url-link:hover { text-decoration: underline; }
        .status-badge { padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; text-transform: uppercase; background-color: #fff3cd; color: #856404; }
    </style>
</head>
<body>

<div class="container">
    <!-- Dynamic Back Button -->
    <div class="back-btn-container">
        <button onclick="goBack()" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i> Back
        </button>
    </div>

    <div class="header">
        <i class="fa-solid fa-shield-halved"></i>
        <h2>Report IPR Infringement</h2>
        <p>If you believe your intellectual property rights have been violated, please submit the details below.</p>
    </div>

    <!-- Submit Form -->
    <form id="iprForm">
        <div class="form-group">
            <label>Brand / Owner Name</label>
            <input type="text" name="brand_name" placeholder="Enter brand or copyright holder name" required>
        </div>

        <div class="form-group">
            <label>Contact Email Address</label>
            <input type="email" name="contact_email" placeholder="Enter official contact email" required>
        </div>

        <div class="form-group">
            <label>Type of Infringement</label>
            <select name="infringement_type" required>
                <option value="" disabled selected>Select Infringement Type</option>
                <option value="Trademark Violation">Trademark Violation (Fake Product/Logo Usage)</option>
                <option value="Copyright Violation">Copyright Violation (Stolen Images/Text)</option>
                <option value="Patent Infringement">Patent Infringement</option>
                <option value="Counterfeit Product">Counterfeit Product Listing</option>
            </select>
        </div>

        <div class="form-group">
            <label>Infringing Product URL / Link</label>
            <input type="url" name="product_url" placeholder="https://nexkart.com/product/123" required>
        </div>

        <div class="form-group">
            <label>Detailed Description & Evidence Link</label>
            <textarea name="description" rows="4" placeholder="Provide full details of your legal ownership and how it is being infringed..." required></textarea>
        </div>

        <button type="submit" class="submit-btn">Submit IPR Notice</button>
    </form>

    <!-- My Reports Data Table -->
    <div class="table-section">
        <div class="header" style="text-align: left; margin-bottom: 15px;">
            <h2 style="font-size: 20px;"><i class="fa-solid fa-list-check"></i> My Submitted IPR Reports</h2>
        </div>
        <div class="table-responsive">
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Brand Name</th>
                        <th>Email</th>
                        <th>Infringement Type</th>
                        <th>Product URL</th>
                        <th>Description</th>
                        <th>Status</th>
                        <th>Created At</th>
                    </tr>
                </thead>
                <tbody id="reportsTableBody">
                    <tr>
                        <td colspan="8" style="text-align: center;">Loading data...</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Universal Back Navigation Function
    function goBack() {
        if (document.referrer && document.referrer.indexOf(window.location.host) !== -1) {
            window.history.back();
        } else {
            window.location.href = '/user/dashboard';
        }
    }

    // Submit IPR Report Form
    document.getElementById('iprForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const formData = {
            brand_name: this.brand_name.value,
            contact_email: this.contact_email.value,
            infringement_type: this.infringement_type.value,
            product_url: this.product_url.value,
            description: this.description.value
        };

        try {
            const response = await fetch('/api/ipr/submit', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify(formData)
            });

            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Server returned non-JSON response.");
            }

            const result = await response.json();

            if (response.ok && result.success) {
                alert(result.message);
                this.reset();
                fetchMyIprReports(); // নতুন ডাটা সাবমিট হওয়ার পর নিজের টেবিল রিফ্রেশ করবে
            } else {
                alert(result.message || 'Failed to submit report.');
            }
        } catch (error) {
            console.error('Submit error:', error);
            alert(error.message);
        }
    });

    // Fetch and Display ONLY Current User's IPR Reports
    async function fetchMyIprReports() {
        const tableBody = document.getElementById('reportsTableBody');
        try {
            const response = await fetch('/api/ipr/my-reports');
            
            const contentType = response.headers.get("content-type");
            if (!contentType || !contentType.includes("application/json")) {
                throw new Error("Route not found or server error.");
            }

            const result = await response.json();

            if (response.status === 401) {
                tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Please login to view your reports.</td></tr>';
                return;
            }

            if (response.ok && result.success) {
                if (!result.data || result.data.length === 0) {
                    tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center;">You have not submitted any IPR reports yet.</td></tr>';
                    return;
                }

                tableBody.innerHTML = result.data.map(item => `
                    <tr>
                        <td><strong>${item.id}</strong></td>
                        <td>${item.brand_name || ''}</td>
                        <td>${item.contact_email || ''}</td>
                        <td>${item.infringement_type || ''}</td>
                        <td>
                            <a href="${item.product_url}" target="_blank" class="url-link" title="${item.product_url}">
                                ${item.product_url}
                            </a>
                        </td>
                        <td>${item.description || ''}</td>
                        <td><span class="status-badge">${item.status || 'Pending'}</span></td>
                        <td>${new Date(item.created_at).toLocaleString()}</td>
                    </tr>
                `).join('');
            } else {
                tableBody.innerHTML = `<tr><td colspan="8" style="text-align: center; color: red;">${result.message || 'Failed to load data.'}</td></tr>`;
            }
        } catch (error) {
            console.error('Fetch error:', error);
            tableBody.innerHTML = '<tr><td colspan="8" style="text-align: center; color: red;">Error fetching data from server.</td></tr>';
        }
    }

    // Page Load হওয়ার সময় ডাটা ফেচ করুন
    document.addEventListener('DOMContentLoaded', fetchMyIprReports);
</script>

</body>
</html>
