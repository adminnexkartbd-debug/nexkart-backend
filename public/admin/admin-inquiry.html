<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexKartBD - Product Inquiries</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Poppins', sans-serif; } </style>
</head>
<body class="bg-slate-100 text-slate-800 p-6">

  <div class="max-w-5xl mx-auto space-y-6">
    <div class="flex items-center justify-between bg-white p-6 rounded-2xl shadow-sm border border-slate-200">
      <h1 class="text-xl font-bold text-slate-800 flex items-center gap-2">
        <i class="fa-solid fa-comments text-pink-600"></i> Product Inquiries & Replies
      </h1>
      <a href="/home.html" class="px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm font-semibold rounded-xl transition">
        <i class="fa-solid fa-arrow-left"></i> Back to Dashboard
      </a>
    </div>

    <!-- Inquiries List Container -->
    <div id="inquiriesContainer" class="space-y-4">
      <p class="text-center text-slate-400 py-10">Loading inquiries...</p>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', fetchInquiries);

    async function fetchInquiries() {
      try {
        const response = await fetch('/api/admin/inquiries/all');
        const data = await response.json();
        
        const container = document.getElementById('inquiriesContainer');
        container.innerHTML = '';

        if (!data.success || data.inquiries.length === 0) {
          container.innerHTML = `<div class="bg-white p-6 rounded-2xl text-center text-slate-400 border border-slate-200">No inquiries found.</div>`;
          return;
        }

        data.inquiries.forEach(item => {
          const card = document.createElement('div');
          card.className = 'bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4';
          
          card.innerHTML = `
            <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 border-b border-slate-100 pb-4">
              <div class="flex items-center gap-3">
                <img src="${item.product_image || 'https://via.placeholder.com/60'}" alt="Product" class="w-14 h-14 rounded-xl object-cover border border-slate-200 shadow-inner">
                <div>
                  <h3 class="font-bold text-slate-800 text-sm sm:text-base">${item.product_title || 'Unknown Product'}</h3>
                  <span class="text-xs text-slate-400">SKU: ${item.sku || 'N/A'} | Regular Price: ৳${item.regular_price || 0}</span>
                </div>
              </div>
              <span class="text-xs px-2.5 py-1 bg-slate-100 text-slate-600 rounded-lg font-medium">User: <strong>${item.user_name}</strong></span>
            </div>

            <div class="bg-slate-50 p-4 rounded-xl border border-slate-100 space-y-1">
              <p class="text-xs font-semibold text-slate-400 uppercase">Question:</p>
              <p class="text-sm text-slate-700 font-medium">${item.question}</p>
            </div>

            <div class="space-y-2">
              <p class="text-xs font-semibold text-slate-400 uppercase">Admin Answer:</p>
              ${item.answer ? `
                <div class="p-3 bg-emerald-50 border border-emerald-100 text-emerald-900 rounded-xl text-sm font-medium">
                  ${item.answer}
                </div>
              ` : `
                <div class="flex gap-2">
                  <input type="text" id="replyInput_${item.id}" placeholder="Write a reply..." class="flex-1 px-4 py-2.5 text-sm border border-slate-200 rounded-xl focus:outline-none focus:ring-1 focus:ring-pink-500 bg-slate-50">
                  <button onclick="sendReply(${item.id})" class="px-5 py-2.5 bg-pink-600 hover:bg-pink-700 text-white text-sm font-semibold rounded-xl shadow-md shadow-pink-600/20 transition cursor-pointer">
                    Reply
                  </button>
                </div>
              `}
            </div>
          `;
          container.appendChild(card);
        });
      } catch (error) {
        console.error('Error fetching inquiries:', error);
      }
    }

    async function sendReply(id) {
      const inputElem = document.getElementById(`replyInput_${id}`);
      const answer = inputElem.value.trim();

      if (!answer) {
        alert("Please write a reply first!");
        return;
      }

      try {
        const response = await fetch(`/api/admin/inquiries/reply/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ answer })
        });
        const result = await response.json();
        if (result.success) {
          fetchInquiries();
        } else {
          alert("Failed to send reply");
        }
      } catch (error) {
        console.error('Error sending reply:', error);
      }
    }
  </script>
</body>
</html>
