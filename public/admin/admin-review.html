<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Review Management</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f2f5;
            color: #1c1e21;
            padding: 24px;
        }

        .header {
            max-width: 1000px;
            margin: 0 auto 24px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 1.5rem;
            color: #1877f2;
        }

        .nav-links {
            display: flex;
            gap: 12px;
        }

        .nav-btn {
            background: #fff;
            border: 1px solid #ccd0d5;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            color: #4b4f56;
            transition: all 0.2s;
        }

        .nav-btn.active, .nav-btn:hover {
            background-color: #1877f2;
            color: #fff;
            border-color: #1877f2;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
            gap: 20px;
        }

        .product-card {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            overflow: hidden;
            border: 1px solid #e4e6eb;
            display: flex;
            flex-direction: column;
        }

        .product-info {
            display: flex;
            align-items: center;
            padding: 16px;
            background-color: #f8f9fa;
            border-bottom: 1px solid #e4e6eb;
        }

        .product-image {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 8px;
            border: 1px solid #ddd;
        }

        .product-details {
            margin-left: 15px;
        }

        .product-title {
            font-size: 1.05rem;
            font-weight: 600;
            color: #1c1e21;
        }

        .product-price {
            font-size: 1.1rem;
            font-weight: bold;
            color: #2e7d32;
            margin-top: 4px;
        }

        .review-section {
            padding: 16px;
            flex-grow: 1;
        }

        .user-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 8px;
        }

        .user-name {
            font-weight: 600;
            color: #333;
            font-size: 0.95rem;
        }

        .rating-stars {
            color: #f59e0b;
            font-size: 1.1rem;
        }

        .review-text {
            color: #4b5563;
            font-size: 0.9rem;
            line-height: 1.4;
            background-color: #f9fafb;
            padding: 10px 12px;
            border-radius: 6px;
            border-left: 3px solid #3b82f6;
        }

        .replied-box {
            margin-top: 10px;
            padding: 8px 12px;
            background-color: #eff6ff;
            border-radius: 6px;
            border-left: 3px solid #10b981;
            font-size: 0.88rem;
        }

        .replied-title {
            font-weight: 600;
            color: #047857;
            margin-bottom: 2px;
        }

        .replied-text {
            color: #1f2937;
        }

        .reply-section {
            padding: 16px;
            background-color: #f9fafb;
            border-top: 1px solid #e4e6eb;
        }

        .reply-section label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #4b5563;
            margin-bottom: 8px;
        }

        .reply-input-group {
            display: flex;
            gap: 8px;
        }

        .reply-input {
            flex: 1;
            padding: 9px 12px;
            border: 1px solid #d1d5db;
            border-radius: 6px;
            outline: none;
            font-size: 0.9rem;
        }

        .reply-btn {
            background-color: #2563eb;
            color: #ffffff;
            border: none;
            padding: 9px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <h1>Admin Review Management</h1>
        <div class="nav-links">
            <button class="nav-btn active" onclick="adminReviewRouter('all')">All Reviews</button>
            <button class="nav-btn" onclick="adminReviewRouter('pending')">Pending Reply</button>
            <button class="nav-btn" onclick="adminReviewRouter('replied')">Replied</button>
        </div>
    </div>

    <div class="container" id="review-list"></div>

    <script>
        let reviewsData = [];

        // স্টার রেন্ডার করার হেল্পার
        function renderStars(rating) {
            let stars = '';
            for (let i = 1; i <= 5; i++) {
                stars += i <= rating ? '★ ' : '☆ ';
            }
            return stars;
        }

        // ১. API থেকে Dynamic Data Fetch করার ফাংশন
        async function loadAdminReviews() {
            try {
                // আপনার সিস্টেমে অনুযায়ী admin_id dynamically পাঠাতে পারেন
                const response = await fetch('/api/admin/reviews');
                const result = await response.json();

                if (result.success) {
                    reviewsData = result.data;
                    adminReviewRouter('all'); // প্রথমবার লোডে সব দেখাবে
                } else {
                    document.getElementById('review-list').innerHTML = `<p style="grid-column: 1/-1; text-align: center;">${result.message}</p>`;
                }
            } catch (error) {
                console.error('Error loading reviews:', error);
                document.getElementById('review-list').innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: red;">ডাটা ফেচ করতে সমস্যা হয়েছে!</p>';
            }
        }

        // ২. Router Function
        function adminReviewRouter(filter = 'all') {
            const container = document.getElementById('review-list');
            container.innerHTML = '';

            const filteredReviews = reviewsData.filter(item => {
                if (filter === 'pending') return !item.review_reply;
                if (filter === 'replied') return item.review_reply && item.review_reply !== '';
                return true;
            });

            if (filteredReviews.length === 0) {
                container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #666; padding: 40px;">কোনো রিভিউ পাওয়া যায়নি।</p>';
                return;
            }

            filteredReviews.forEach(item => {
                const card = document.createElement('div');
                card.className = 'product-card';

                const replyHtml = item.review_reply 
                    ? `<div class="replied-box">
                         <div class="replied-title">Admin Reply:</div>
                         <div class="replied-text">${item.review_reply}</div>
                       </div>`
                    : '';

                // CSP Error এড়ানোর জন্য secure/placeholder image
                const pImage = item.image || 'https://via.placeholder.com/150';

                card.innerHTML = `
                    <div class="product-info">
                        <img src="${pImage}" alt="${item.product_name}" class="product-image">
                        <div class="product-details">
                            <h3 class="product-title">${item.product_name}</h3>
                            <div class="product-price">৳ ${item.sale_price || item.regular_price}</div>
                        </div>
                    </div>

                    <div class="review-section">
                        <div class="user-info">
                            <span class="user-name">${item.user_name || 'Customer'}</span>
                            <div class="rating-stars">${renderStars(item.rating)}</div>
                        </div>
                        <p class="review-text">"${item.review_text}"</p>
                        ${replyHtml}
                    </div>

                    <div class="reply-section">
                        <label for="reply-input-${item.review_id}">
                            ${item.review_reply ? 'Update Admin Reply:' : 'Send Admin Reply:'}
                        </label>
                        <div class="reply-input-group">
                            <input type="text" id="reply-input-${item.review_id}" class="reply-input" placeholder="এখানে রিপ্লাই লিখুন..." value="${item.review_reply || ''}">
                            <button type="button" class="reply-btn" onclick="submitReply(${item.review_id})">
                                ${item.review_reply ? 'Update' : 'Reply'}
                            </button>
                        </div>
                    </div>
                `;

                container.appendChild(card);
            });

            // Active Tab Style
            const buttons = document.querySelectorAll('.nav-btn');
            buttons.forEach(btn => btn.classList.remove('active'));
            if (filter === 'all') buttons[0].classList.add('active');
            if (filter === 'pending') buttons[1].classList.add('active');
            if (filter === 'replied') buttons[2].classList.add('active');
        }

        // ৩. Admin Reply Submit/Update API Function
        async function submitReply(reviewId) {
            const inputField = document.getElementById(`reply-input-${reviewId}`);
            const replyText = inputField.value.trim();

            if (!replyText) {
                alert('অনুগ্রহ করে রিপ্লাই টেক্সট লিখুন!');
                return;
            }

            try {
                const response = await fetch('/api/admin/reviews/reply', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        review_id: reviewId,
                        reply_text: replyText
                    })
                });

                const result = await response.json();
                if (result.success) {
                    alert('রিপ্লাই সফলভাবে সেভ হয়েছে!');
                    loadAdminReviews(); // Data Reload
                } else {
                    alert(result.message || 'Error occurred!');
                }
            } catch (err) {
                console.error(err);
                alert('সার্ভারে সমস্যা হয়েছে!');
            }
        }

        document.addEventListener('DOMContentLoaded', loadAdminReviews);
    </script>
</body>
</html>
