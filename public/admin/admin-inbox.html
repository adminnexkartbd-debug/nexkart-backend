<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NexKartBD - Admin Inbox</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style> body { font-family: 'Plus Jakarta Sans', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 flex h-screen overflow-hidden">

  <!-- SIDEBAR -->
  <aside class="w-20 lg:w-64 bg-slate-900 text-white flex flex-col justify-between shrink-0 transition-all duration-300">
    <div>
      <div class="h-20 flex items-center justify-center lg:justify-start lg:px-6 bg-slate-950 border-b border-slate-800">
        <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white font-bold text-lg shadow-lg">N</div>
        <span class="hidden lg:inline-block font-bold text-lg tracking-wide ml-3">NexKartBD</span>
      </div>
      <nav class="p-4 space-y-3">
        <a href="/admin/home.html" class="flex items-center justify-center lg:justify-start gap-3 px-4 py-3.5 bg-indigo-600 text-white rounded-2xl font-semibold shadow-lg transition">
          <i class="fa-solid fa-house text-lg"></i>
          <span class="hidden lg:inline text-sm">Dashboard</span>
        </a>
      </nav>
    </div>
  </aside>

  <!-- MAIN CHAT CONTAINER -->
  <div class="flex-1 flex flex-col h-screen overflow-hidden bg-white">
    
    <!-- HEADER -->
    <header class="h-20 border-b border-slate-100 px-8 flex items-center justify-between shrink-0">
      <div class="flex items-center gap-4">
        <div class="w-12 h-12 rounded-2xl bg-indigo-50 flex items-center justify-center text-indigo-600">
          <i class="fa-solid fa-comments text-xl"></i>
        </div>
        <div>
          <h1 class="text-lg font-bold text-slate-900">Customer Support Inbox</h1>
          <p class="text-xs text-slate-400" id="seller-display-info">Manage real-time customer queries, images & videos</p>
        </div>
      </div>
    </header>

    <!-- BODY WRAPPER -->
    <div class="flex-1 flex overflow-hidden">

      <!-- LEFT: CUSTOMER LIST -->
      <div class="w-96 border-r border-slate-100 flex flex-col bg-slate-50/50 shrink-0">
        <div class="p-5 border-b border-slate-100 flex items-center justify-between">
          <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">Conversations</span>
          <span id="total-customer-count" class="bg-indigo-50 text-indigo-600 text-xs font-bold px-2.5 py-1 rounded-full">0 Conversations</span>
        </div>
        <div id="customer-list" class="flex-1 overflow-y-auto divide-y divide-slate-100/60 p-3 space-y-1"></div>
      </div>

      <!-- MIDDLE: CHAT AREA -->
      <div class="flex-1 flex flex-col bg-white">
        
        <div class="h-20 border-b border-slate-100 px-8 flex items-center justify-between shrink-0 bg-white" id="active-chat-header">
          <div class="flex items-center gap-4">
            <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 font-bold">?</div>
            <div>
              <h3 class="text-sm font-bold text-slate-900">Select a conversation</h3>
              <span class="text-xs text-slate-400">Choose from the left sidebar</span>
            </div>
          </div>
        </div>

        <!-- MESSAGES CONTAINER -->
        <div id="message-container" class="flex-1 overflow-y-auto p-8 space-y-6 bg-slate-50/30">
          <div class="flex flex-col items-center justify-center h-full text-center">
            <p class="text-sm font-semibold text-slate-600">No chat selected</p>
          </div>
        </div>

        <!-- TYPING & SEND FOOTER -->
        <div class="p-5 border-t border-slate-100 bg-white shrink-0">
          <form id="reply-form" class="flex items-center gap-3 bg-slate-50 p-2 rounded-2xl border border-slate-200">
            <input type="text" id="reply-input" placeholder="Type your reply here..." class="flex-1 bg-transparent px-4 py-2.5 text-sm focus:outline-none text-slate-800">
            <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-6 py-3 rounded-xl font-semibold text-xs shadow-lg transition flex items-center gap-2">
              <span>Send</span> <i class="fa-solid fa-paper-plane text-xs"></i>
            </button>
          </form>
        </div>

      </div>

    </div>
  </div>

  <!-- FULL WINDOW MEDIA MODAL -->
  <div id="mediaModal" class="fixed inset-0 bg-black/90 z-[9999] hidden flex items-center justify-center p-4">
    <button onclick="closeMediaModal()" class="absolute top-5 right-5 text-white text-3xl hover:text-slate-300">
      <i class="fa-solid fa-xmark"></i>
    </button>
    <div id="modalContent" class="max-w-4xl max-h-[90vh] flex items-center justify-center overflow-hidden">
    </div>
  </div>

 <script>
  let sellerId = null;
  let activeCustomerId = null;
  let activeCustomerName = "";
  let activeCustomerImage = "";

  const DEFAULT_AVATAR = "https://ui-avatars.com/api/?background=6366f1&color=fff&name=";

  async function checkSellerSession() {
    try {
      const res = await fetch('/api/admin-inbox/seller/profile', { credentials: 'include' });
      const contentType = res.headers.get("content-type");
      if (!contentType || !contentType.includes("application/json")) {
        alert("Seller session missing! Please log in again.");
        window.location.href = "/admin/login.html";
        return;
      }

      const data = await res.json();
      if (data.success && data.seller?.id) {
        sellerId = data.seller.id;
        const sellerInfoEl = document.getElementById('seller-display-info');
        if (sellerInfoEl) {
          sellerInfoEl.innerText = `Logged in as: ${data.seller.name || 'Seller'} (${data.seller.shop_name || 'Shop'})`;
        }
        loadConversations();
      } else {
        alert("Seller session missing! Please log in again.");
        window.location.href = "/admin/login.html";
      }
    } catch (err) {
      console.error("Session fetch error:", err);
    }
  }

  function getImageUrl(imgPath, name = 'User') {
    if (!imgPath || imgPath === 'null' || imgPath === 'undefined' || imgPath.trim() === '') {
      return `${DEFAULT_AVATAR}${encodeURIComponent(name)}`;
    }
    let url = imgPath.trim();
    if (url.startsWith('//')) return 'https:' + url;
    if (url.startsWith('http://') || url.startsWith('https://')) return url;
    return url.startsWith('/') ? url : '/' + url;
  }

  async function loadConversations() {
    if (!sellerId) return;
    try {
      const response = await fetch(`/api/admin-inbox/conversations/${sellerId}`, { credentials: 'include' });
      const data = await response.json();

      if (data.success && data.conversations) {
        const customerListEl = document.getElementById('customer-list');
        document.getElementById('total-customer-count').innerText = `${data.conversations.length} Chats`;
        customerListEl.innerHTML = '';

        data.conversations.forEach(conv => {
          const isPendingCustomer = (conv.last_sender_type === 'customer' && conv.last_status === 'Pending');
          const custName = conv.customer_name || 'Customer';
          const userImg = getImageUrl(conv.customer_image, custName);

          const div = document.createElement('div');
          div.className = `flex items-center justify-between p-3.5 hover:bg-white cursor-pointer rounded-2xl transition border ${isPendingCustomer ? 'bg-indigo-50/60 border-indigo-100 font-bold' : 'border-transparent hover:border-slate-100'}`;
          
          div.innerHTML = `
            <div class="flex items-center gap-3 min-w-0 flex-1" onclick="selectConversation('${conv.customer_id}', '${custName.replace(/'/g, "\\'")}', '${userImg.replace(/'/g, "\\'")}')">
              <div class="relative shrink-0">
                <img src="${userImg}" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR}${encodeURIComponent(custName)}';" alt="User" class="w-12 h-12 rounded-full object-cover border">
              </div>
              <div class="flex-1 min-w-0">
                <div class="flex items-center justify-between">
                  <h4 class="text-xs ${isPendingCustomer ? 'font-extrabold text-indigo-900' : 'font-bold text-slate-800'} truncate">${custName}</h4>
                  <span class="text-[10px] text-slate-400">${conv.last_message_time ? new Date(conv.last_message_time).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : ''}</span>
                </div>
                <p class="text-[11px] ${isPendingCustomer ? 'text-indigo-600 font-semibold' : 'text-slate-400'} truncate mt-1">Total Messages: ${conv.total_messages}</p>
              </div>
            </div>
            
            <div class="relative ml-2" onclick="event.stopPropagation()">
              <button onclick="toggleMenu(event, '${conv.customer_id}')" class="p-2 text-slate-400 hover:text-slate-600 rounded-full">
                <i class="fa-solid fa-ellipsis-vertical text-xs"></i>
              </button>
              <div id="menu-${conv.customer_id}" class="hidden absolute right-0 mt-2 w-28 bg-white border border-slate-100 rounded-xl shadow-lg z-50 py-1">
                <button onclick="confirmDelete('${conv.customer_id}')" class="w-full text-left px-4 py-2 text-xs text-red-600 hover:bg-red-50 font-semibold flex items-center gap-2">
                  <i class="fa-solid fa-trash text-[10px]"></i> Delete
                </button>
              </div>
            </div>
          `;
          customerListEl.appendChild(div);
        });
      }
    } catch (error) { console.error(error); }
  }

  function toggleMenu(event, customerId) {
    document.querySelectorAll('[id^="menu-"]').forEach(el => {
      if (el.id !== `menu-${customerId}`) el.classList.add('hidden');
    });
    const menu = document.getElementById(`menu-${customerId}`);
    menu.classList.toggle('hidden');
  }

  window.addEventListener('click', () => {
    document.querySelectorAll('[id^="menu-"]').forEach(el => el.classList.add('hidden'));
  });

  async function confirmDelete(customerId) {
    if (!sellerId) return;
    if (confirm("Are you sure you want to delete this conversation and its Cloudinary media files?")) {
      try {
        const res = await fetch(`/api/admin-inbox/conversation/${sellerId}/${customerId}`, {
          method: 'DELETE',
          credentials: 'include'
        });
        const data = await res.json();
        if (data.success) {
          if (activeCustomerId === customerId) {
            activeCustomerId = null;
            document.getElementById('message-container').innerHTML = `<div class="text-center text-slate-400 text-xs mt-20">No chat selected</div>`;
            document.getElementById('active-chat-header').innerHTML = `
              <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-full bg-slate-100 flex items-center justify-center text-slate-400 font-bold">?</div>
                <div>
                  <h3 class="text-sm font-bold text-slate-900">Select a conversation</h3>
                  <span class="text-xs text-slate-400">Choose from the left sidebar</span>
                </div>
              </div>
            `;
          }
          loadConversations();
        } else {
          alert("Failed to delete conversation.");
        }
      } catch (err) {
        console.error(err);
      }
    }
  }

  function selectConversation(customerId, customerName, customerImage) {
    activeCustomerId = customerId;
    activeCustomerName = customerName;
    activeCustomerImage = customerImage;
    loadMessages(activeCustomerId, activeCustomerName, activeCustomerImage);
  }

  async function loadMessages(customerId, customerName, customerImage) {
    if (!sellerId) return;
    try {
      const formattedCustomerImage = getImageUrl(customerImage, customerName);

      document.getElementById('active-chat-header').innerHTML = `
        <div class="flex items-center gap-4">
          <img src="${formattedCustomerImage}" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR}${encodeURIComponent(customerName)}';" class="w-12 h-12 rounded-full object-cover border">
          <div>
            <h3 class="text-sm font-bold text-slate-900">${customerName}</h3>
            <span class="text-xs text-slate-400 font-medium">Customer Support</span>
          </div>
        </div>
      `;

      const response = await fetch(`/api/admin-inbox/messages/${sellerId}/${customerId}`, { credentials: 'include' });
      const data = await response.json();
      
      loadConversations();

      const messageContainer = document.getElementById('message-container');
      messageContainer.innerHTML = '';

      if (data.success && data.messages) {
        if (data.messages.length === 0) {
          messageContainer.innerHTML = `<div class="text-center text-slate-400 text-xs mt-20">No messages yet.</div>`;
          return;
        }

        data.messages.forEach(msg => {
          const isSenderSeller = (msg.sender_type === 'seller');
          let imgPath = msg.sms_image ? getImageUrl(msg.sms_image) : '';
          let videoPath = msg.sms_video ? getImageUrl(msg.sms_video) : '';

          let mediaContent = '';
          if (msg.sms_image) {
              mediaContent += `
                <div class="relative group cursor-pointer mt-2" onclick="openMediaModal('image', '${imgPath}')">
                  <img src="${imgPath}" class="w-56 max-h-60 rounded-xl object-cover border border-white/20 shadow-sm" onerror="this.onerror=null; this.src='https://via.placeholder.com/150?text=Image+Not+Found'">
                  <div class="absolute inset-0 bg-black/20 group-hover:bg-black/40 transition rounded-xl flex items-center justify-center opacity-0 group-hover:opacity-100">
                    <i class="fa-solid fa-expand text-white text-lg"></i>
                  </div>
                </div>`;
          }
          if (msg.sms_video) {
              mediaContent += `
                <div class="relative group cursor-pointer mt-2" onclick="openMediaModal('video', '${videoPath}')">
                  <video src="${videoPath}" class="w-56 max-h-60 rounded-xl shadow-sm object-cover"></video>
                  <div class="absolute inset-0 bg-black/40 flex items-center justify-center rounded-xl">
                    <div class="w-10 h-10 rounded-full bg-white/80 flex items-center justify-center text-indigo-600 shadow-md">
                      <i class="fa-solid fa-play ml-0.5 text-sm"></i>
                    </div>
                  </div>
                </div>`;
          }

          let timeString = '';
          if (msg.sms_send_time) {
              let msgDate = new Date(msg.sms_send_time);
              let timeStr = msgDate.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
              let dateStr = msgDate.toLocaleDateString();
              timeString = `${dateStr} ${timeStr}`;
          }

          if (isSenderSeller) {
            messageContainer.innerHTML += `
              <div class="flex items-end justify-end gap-2">
                <div class="max-w-md bg-indigo-600 text-white p-4 rounded-2xl rounded-br-none shadow-sm text-xs space-y-1">
                  ${msg.sms_text ? `<p class="leading-relaxed">${msg.sms_text}</p>` : ''}
                  ${mediaContent}
                  <span class="text-[10px] text-indigo-200 block text-right mt-1">${timeString}</span>
                </div>
              </div>
            `;
          } else {
            messageContainer.innerHTML += `
              <div class="flex items-end gap-2">
                <img src="${formattedCustomerImage}" onerror="this.onerror=null; this.src='${DEFAULT_AVATAR}${encodeURIComponent(customerName)}';" class="w-8 h-8 rounded-full object-cover mb-1 border">
                <div class="max-w-md bg-white border border-slate-100 p-4 rounded-2xl rounded-bl-none shadow-sm text-xs text-slate-700 space-y-1">
                  ${msg.sms_text ? `<p class="leading-relaxed">${msg.sms_text}</p>` : ''}
                  ${mediaContent}
                  <span class="text-[10px] text-slate-400 block text-right mt-1">${timeString}</span>
                </div>
              </div>
            `;
          }
        });
        messageContainer.scrollTop = messageContainer.scrollHeight;
      }
    } catch (error) { console.error(error); }
  }

  function openMediaModal(type, url) {
    const modal = document.getElementById('mediaModal');
    const container = document.getElementById('modalContent');
    
    if (type === 'image') {
      container.innerHTML = `<img src="${url}" class="max-w-full max-h-[85vh] rounded-lg shadow-2xl object-contain">`;
    } else if (type === 'video') {
      container.innerHTML = `<video src="${url}" controls autoplay class="max-w-full max-h-[85vh] rounded-lg shadow-2xl"></video>`;
    }
    modal.classList.remove('hidden');
  }

  function closeMediaModal() {
    const modal = document.getElementById('mediaModal');
    const container = document.getElementById('modalContent');
    container.innerHTML = '';
    modal.classList.add('hidden');
  }

  document.getElementById('reply-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!sellerId) return alert("Seller session not found!");
      if (!activeCustomerId) return alert("Please select a customer first!");

      const messageInput = document.getElementById('reply-input');
      const messageText = messageInput.value.trim();
      if (!messageText) return;

      try {
          const response = await fetch('/api/admin-inbox/send-message', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              credentials: 'include',
              body: JSON.stringify({
                  seller_id: sellerId,
                  customer_id: activeCustomerId,
                  sms_text: messageText,
                  sms_image: null,
                  sms_video: null
              })
          });

          const result = await response.json();
          if (result.success) {
              messageInput.value = '';
              loadMessages(activeCustomerId, activeCustomerName, activeCustomerImage);
              loadConversations();
          } else {
              alert("Failed to send message.");
          }
      } catch (err) { console.error(err); }
  });

  document.addEventListener('DOMContentLoaded', () => { 
    checkSellerSession();
  });
</script>

</body>
</html>
